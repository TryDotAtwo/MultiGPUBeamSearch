[build-system]
requires = ["maturin>=1.12.2,<2"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "multigpubeamsearch"
version = "0.1.0.dev1"
description = "Optional CayleyPy adapter for the native MultiGPUBeamSearch solver"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MultiGPUBeamSearch contributors"}]
dependencies = ["cayleypy>=0.1.0", "torch>=2.6", "cmake>=3.28", "ninja>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://github.com/TryDotAtwo/MultiGPUBeamSearch"
Documentation = "https://github.com/TryDotAtwo/MultiGPUBeamSearch/tree/main/integrations/cayleypy_native"
Issues = "https://github.com/TryDotAtwo/MultiGPUBeamSearch/issues"

[tool.maturin]
manifest-path = "../../rust/beam-python/Cargo.toml"
python-source = "."
python-packages = ["multigpubeamsearch", "cayleypy_native"]
module-name = "multigpubeamsearch._beam_runtime"
bindings = "pyo3"
locked = true
include = [
  {path = "build_backend.py", format = "sdist"},
  "multigpubeamsearch/_native_source/**/*",
  "multigpubeamsearch/_bin/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
