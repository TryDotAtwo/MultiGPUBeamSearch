[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cayleypy-native"
version = "0.1.0.dev0"
description = "Optional CayleyPy adapter for the native MultiGPUBeamSearch solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cayleypy>=0.1.0", "torch>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cayleypy_native*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
