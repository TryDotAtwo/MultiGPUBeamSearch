[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cayleypy-native"
version = "0.1.0.dev0"
description = "Optional CayleyPy adapter for the native MultiGPUBeamSearch solver"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MultiGPUBeamSearch contributors"}]
dependencies = ["cayleypy>=0.1.0", "torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://github.com/TryDotAtwo/MultiGPUBeamSearch"
Documentation = "https://github.com/TryDotAtwo/MultiGPUBeamSearch/tree/main/integrations/cayleypy_native"
Issues = "https://github.com/TryDotAtwo/MultiGPUBeamSearch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cayleypy_native*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
