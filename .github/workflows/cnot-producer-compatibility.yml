name: CNOT producer panel-v2 source compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-current-producer-adapter:
    name: Compile pinned panel-v2 adapter with CPU PyTorch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: Find a completed build for these inputs
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION_USED: ${{ steps.python.outputs.python-version }}
          PANEL_INPUTS: >-
            ${{ hashFiles('.github/workflows/cnot-producer-compatibility.yml',
                         'integrations/cnot_scorer/build.py', 'integrations/cnot_scorer/bridge_panel_v2.rs',
                         'integrations/cnot_scorer/handoff.py', 'integrations/cnot_scorer/test_handoff.py',
                         'tools/cnot_producer_compatibility.py', 'tools/test_cnot_producer_compatibility.py') }}
        run: python3 tools/cnot_producer_compatibility.py
      - name: Carry the last failed build for identical inputs
        if: steps.previous.outputs.verdict == 'failure'
        run: |
          echo "These inputs failed the last full build. Re-run this job to retry."
          exit 1
      - name: Run cheap CPU panel-v2 contract checks before building
        if: steps.previous.outputs.verdict == 'run'
        run: |
          python3 tools/test_cnot_producer_compatibility.py
          (cd integrations/cnot_scorer && python3 -m unittest -v test_handoff)
      - uses: actions/checkout@v4
        if: steps.previous.outputs.verdict == 'run'
        with:
          repository: TryDotAtwo/cnot-neural-synth-frontier6
          ref: e17953891a36e3e3ae8b038695bfac8548ab784f
          path: cnot-producer
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.previous.outputs.verdict == 'run'
        with:
          repository: TryDotAtwo/cnot-neural-synth-frontier6
          ref: 42ed72f587ab70fc74a85cf0a25001efb29cb994
          path: cnot-emitter
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned CPU PyTorch
        if: steps.previous.outputs.verdict == 'run'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu \
            > "$RUNNER_TEMP/producer-adapter-pip.log" 2>&1
      - name: Prepare and compile the pinned producer adapter
        id: cpu_compile
        if: steps.previous.outputs.verdict == 'run'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
          LIBTORCH_USE_PYTORCH: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/cnot-panel-v2-target
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/cnot-panel-v2-build"
          if ! python integrations/cnot_scorer/build.py --contract panel_search_v2 \
              --source "$GITHUB_WORKSPACE/cnot-producer" \
              --build-dir "$build_dir" --prepare-only > "$RUNNER_TEMP/producer-adapter-prepare.log" 2>&1; then
            exit 1
          fi
          native="$build_dir/native"
          torch_lib="$(python -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent / "lib")')"
          export LD_LIBRARY_PATH="$torch_lib:${LD_LIBRARY_PATH:-}"
          if ! cargo check --locked --features torch --lib --manifest-path "$native/Cargo.toml" \
              > "$RUNNER_TEMP/producer-adapter-cargo.log" 2>&1; then
            exit 1
          fi
          cargo test --locked --features torch --lib mgbs_scorer_panel_v2::tests \
            --manifest-path "$native/Cargo.toml" \
            > "$RUNNER_TEMP/producer-adapter-tests.log" 2>&1
      - name: Run the pinned emitter through the consumer fixture
        id: handoff_tests
        if: steps.previous.outputs.verdict == 'run'
        shell: bash
        env:
          CNOT103_PRODUCER_CHECKOUT: ${{ github.workspace }}/cnot-emitter
          CNOT103_PRODUCER_SOURCE_SHA: 42ed72f587ab70fc74a85cf0a25001efb29cb994
        run: |
          set -euo pipefail
          (cd integrations/cnot_scorer && python3 -m unittest -v test_handoff) \
            > "$RUNNER_TEMP/producer-handoff-test.log" 2>&1
      # Only a full build creates an entry. The existing workflow file is a small cache payload.
      - name: Remember the full build outcome
        if: ${{ !cancelled() && steps.previous.outputs.verdict == 'run' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: ${{ steps.previous.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ job.status }}
          path: .github/workflows/cnot-producer-compatibility.yml
      - name: Upload native diagnostics on failure
        if: ${{ failure() && steps.previous.outputs.verdict == 'run' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cnot-panel-v2-compatibility-logs
          path: ${{ runner.temp }}/producer-*.log
          if-no-files-found: ignore
          retention-days: 14
