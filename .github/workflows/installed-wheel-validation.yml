name: Installed Python wheel validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/beam-*"
    paths:
      - .github/workflows/installed-wheel-validation.yml
      - .github/workflows/vast-cnot-control-collectives.yml
      - integrations/cayleypy_native/tests/installed_wheel_smoke.py
      - integrations/cayleypy_native/tests/installed_cnot_dtype_contract.py
      - integrations/cayleypy_native/tests/installed_cnot_backend_admission.py
      - integrations/cayleypy_native/tests/installed_cnot_phase_boundaries.py
      - integrations/cayleypy_native/tests/installed_verify_cnot_gloo_lifecycle.py
      - integrations/cayleypy_native/tests/test_build.py
      - integrations/cayleypy_native/tests/test_public_index_sort_build.py
      - integrations/cayleypy_native/multigpubeamsearch/native_source_manifest.json
      - tools/cnot_acceptance_events.py
      - tools/test_cnot_acceptance_events.py
      - tools/verify_cnot_gpu_pair.py
      - tools/test_verify_cnot_gpu_pair.py
      - CMakeLists.txt
      - tools/production_runner.cu
      - tools/verify_permutation_cuda.py
      - tools/vast_cnot_gpu_acceptance.sh
      - tools/permutation_acceptance.py
      - tools/test_permutation_acceptance.py
      - tools/test_cnot_gpu_identity.py
      - tools/vast_campaign_guard.py
      - tools/test_vast_campaign_guard.py
      - tools/vast_campaign_watchdog.py
      - tools/test_vast_campaign_watchdog.py
      - tools/test_vast_campaign_workflow.py
      - .github/workflows/vast-campaign-watchdog.yml
      - integrations/cayleypy_native/multigpubeamsearch/gpu_identity.py
      - tools/fixtures/cnot_acceptance_event_v1.jsonl
      - integrations/cayleypy_native/tests/cnot_device_domain_admission_fixture.c
      - tools/verify_cnot.py
      - tools/test_cnot_reference_order.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_acceptance.py
      - integrations/cayleypy_native/pyproject.toml
      - integrations/cayleypy_native/build_backend.py
      - integrations/cayleypy_native/multigpubeamsearch/**
      - integrations/cayleypy_native/cayleypy_native/**
      - Cargo.toml
      - Cargo.lock
      - rust/beam-**

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        id: rust_toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install CPU runtime dependencies
        id: dependencies
        run: |
          set -o pipefail
          mkdir -p test_results/refactor_20261120/installed-wheel
          python -m pip install --upgrade pip 2>&1 | tee test_results/refactor_20261120/installed-wheel/dependencies.log
          python -m pip install numpy cayleypy==0.1.0 cmake ninja pytest 2>&1 | tee -a test_results/refactor_20261120/installed-wheel/dependencies.log
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee -a test_results/refactor_20261120/installed-wheel/dependencies.log
      - name: Build the PEP 517 wheel
        id: wheel_build
        working-directory: integrations/cayleypy_native
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/mgbs-wheel-dist"
          python -m pip wheel --verbose --no-deps --wheel-dir "$RUNNER_TEMP/mgbs-wheel-dist" . 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/build.log"
      - name: Install wheel and validate from outside the checkout
        id: wheel_smoke
        run: |
          set -o pipefail
          wheel="$(find "$RUNNER_TEMP/mgbs-wheel-dist" -maxdepth 1 -type f -name 'multigpubeamsearch-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel" 2>&1 | tee test_results/refactor_20261120/installed-wheel/install.log
          python -m pip check 2>&1 | tee test_results/refactor_20261120/installed-wheel/pip-check.log
          mkdir -p "$RUNNER_TEMP/mgbs-wheel-smoke"
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/installed_wheel_smoke.py" 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/smoke.log"
      - name: Verify vendored source headers invalidate the installed native fingerprint
        id: vendor_source_fingerprint
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test_results/refactor_20261121/vast-source-archive"
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          env -u PYTHONPATH python -m pytest -vv \
            "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/test_build.py" \
            -k 'vendored_headers or native_source_bundle' 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/vast-source-archive/fingerprint-test.log"
      - name: Check Rust serde output against the shared CNOT event fixture
        id: event_serde
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission"
          cargo test --locked -p beam-python --no-default-features cnot_acceptance::tests::rust_serde_record_matches_the_shared_jsonl_producer_fixture -- --exact \
            2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/cnot-event-serde.log"
      - name: Verify CNOT PyO3 dtype contracts with warnings as errors
        id: dtype
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/installed_cnot_dtype_contract.py" 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/cnot-dtype.log"
      - name: Verify strict CNOT backend admission on CPU Gloo
        id: backend_admission
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/installed_cnot_backend_admission.py" 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/cnot-backend-admission.log"
      - name: Verify CNOT Gloo phase failures and live-group reuse
        id: phase_boundaries
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          timeout --signal=TERM --kill-after=15s 180s \
            env -u PYTHONPATH python "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/installed_cnot_phase_boundaries.py" \
            2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/cnot-phase-boundaries.log"
      - name: Verify run-scoped CNOT backend event receipts
        id: acceptance_events
        run: |
          set -o pipefail
          python "$GITHUB_WORKSPACE/tools/test_cnot_acceptance_events.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/cnot-acceptance-events.log"
      - name: Verify CNOT reference-score ordering and boundary ties
        id: cnot_reference_order
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission"
          python -m py_compile "$GITHUB_WORKSPACE/tools/test_cnot_reference_order.py"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/tools/test_cnot_reference_order.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/cnot-reference-order.log"
      - name: Verify paired CNOT acceptance result binding on CPU
        id: cnot_pair_verifier
        run: |
          set -o pipefail
          python "$GITHUB_WORKSPACE/tools/test_verify_cnot_gpu_pair.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/cnot-pair-verifier.log"
      - name: Verify saturated permutation acceptance contracts on CPU
        id: permutation_acceptance_cpu
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test_results/refactor_20261121/permutation-acceptance"
          python -m py_compile "$GITHUB_WORKSPACE/tools/permutation_acceptance.py" "$GITHUB_WORKSPACE/tools/test_permutation_acceptance.py" "$GITHUB_WORKSPACE/tools/verify_permutation_cuda.py"
          bash -n "$GITHUB_WORKSPACE/tools/vast_cnot_gpu_acceptance.sh"
          python "$GITHUB_WORKSPACE/tools/test_permutation_acceptance.py" -v 2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/permutation-acceptance/cpu-contract.log"
      - name: Verify the installed wheel packages CUDA identity helper
        id: wheel_gpu_identity
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import multigpubeamsearch.gpu_identity as identity
          assert callable(identity.observe_current_cuda_uuid)
          print("INSTALLED_GPU_IDENTITY_HELPER=" + identity.__file__)
          PY
          python "$GITHUB_WORKSPACE/tools/test_cnot_gpu_identity.py" -v
      - name: Exercise verify_cnot World lifecycle with two Gloo ranks
        id: verify_cnot_lifecycle
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          timeout --signal=TERM --kill-after=15s 180s \
            env -u PYTHONPATH python -m torch.distributed.run --standalone --nproc_per_node=2 \
            "$GITHUB_WORKSPACE/integrations/cayleypy_native/tests/installed_verify_cnot_gloo_lifecycle.py" \
            2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/verify-cnot-gloo-lifecycle.log"
          python - "$RUNNER_TEMP" <<'PY' 2>&1 | tee -a "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/verify-cnot-gloo-lifecycle.log"
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          rows = [json.loads((root / f"verify-cnot-lifecycle-rank-{rank}.json").read_text()) for rank in range(2)]
          if rows[0] != rows[1]:
              raise SystemExit(f"ranks observed different failure phases: {rows}")
          if [item["failed_rank"] for item in rows[0]] != [0, 1]:
              raise SystemExit(f"missing rank-local failure scenarios: {rows[0]}")
          for item in rows[0]:
              if "load trained scorer failed" not in item["error"]:
                  raise SystemExit(f"failure escaped the expected common phase: {item}")
          for index in range(2):
              report = json.loads((root / f"healthy-after-{index}.json").read_text())
              if report.get("status") != "solved" or not report.get("bitwise_replay"):
                  raise SystemExit(f"healthy follow-up search failed: {report}")
          print("VERIFY_CNOT_GLOO_RANK_FAILURES_AND_REUSE_PASS")
          PY
      - name: Run public CNOT search through the installed wheel
        id: public_search
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/mgbs-wheel-smoke"
          cd "$RUNNER_TEMP/mgbs-wheel-smoke"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/tools/verify_cnot.py" \
            --case wide --backend gloo --engine rust \
            --output "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/cnot-wide-rust.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261120/installed-wheel/cnot-wide-rust.log"
      - name: Lint the new-host acceptance workflow
        id: vast_workflow_lint
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/vast-cnot-control-collectives.yml \
            .github/workflows/vast-campaign-watchdog.yml \
            2>&1 | tee "$GITHUB_WORKSPACE/test_results/refactor_20261121/rust-cnot-admission/vast-workflow-actionlint.log"
      - name: Write hosted verification status board
        if: always()
        env:
          TOOLCHAIN: ${{ steps.rust_toolchain.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          WHEEL_BUILD: ${{ steps.wheel_build.outcome }}
          WHEEL_SMOKE: ${{ steps.wheel_smoke.outcome }}
          DTYPE: ${{ steps.dtype.outcome }}
          BACKEND_ADMISSION: ${{ steps.backend_admission.outcome }}
          PHASE_BOUNDARIES: ${{ steps.phase_boundaries.outcome }}
          PUBLIC_SEARCH: ${{ steps.public_search.outcome }}
          ACCEPTANCE_EVENTS: ${{ steps.acceptance_events.outcome }}
          CNOT_PAIR_VERIFIER: ${{ steps.cnot_pair_verifier.outcome }}
          VERIFY_CNOT_LIFECYCLE: ${{ steps.verify_cnot_lifecycle.outcome }}
          EVENT_SERDE: ${{ steps.event_serde.outcome }}
          VAST_WORKFLOW_LINT: ${{ steps.vast_workflow_lint.outcome }}
          PERMUTATION_ACCEPTANCE_CPU: ${{ steps.permutation_acceptance_cpu.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test_results/refactor_20261121/rust-cnot-admission
          cat > test_results/refactor_20261121/rust-cnot-admission/hosted-run.md <<EOF
          # Hosted CPU and installed-wheel validation

          - Source SHA: ${GITHUB_SHA}
          - Rust toolchain: ${TOOLCHAIN}
          - CPU runtime dependencies: ${DEPENDENCIES}
          - PEP 517 wheel build: ${WHEEL_BUILD}
          - Installed-wheel public API smoke: ${WHEEL_SMOKE}
          - CNOT dtype contract with deprecation warnings as errors: ${DTYPE}
          - Strict backend admission and activation mismatch over two-rank Gloo: ${BACKEND_ADMISSION}
          - Winner packet/history failure injection and live-group reuse: ${PHASE_BOUNDARIES}
          - Public CNOT Rust-controller search: ${PUBLIC_SEARCH}
          - Run-scoped backend event protocol and negative validator fixtures: ${ACCEPTANCE_EVENTS}
          - Final paired CNOT campaign verifier and per-rank identity binding: ${CNOT_PAIR_VERIFIER}
          - Independent saturated permutation CPU oracle, strict trace parser and production source contracts: ${PERMUTATION_ACCEPTANCE_CPU}
          - Physical saturated permutation 1/2 GPU case: not run by hosted CPU workflow.
          - Rust serde producer matches the JSONL fixture consumed by the verifier: ${EVENT_SERDE}
          - Actual verify_cnot entry under two-rank Gloo with rank-local scorer failures and subsequent healthy runs: ${VERIFY_CNOT_LIFECYCLE}
          - New-host GPU workflow scheduling and expression validation: ${VAST_WORKFLOW_LINT}
          - CUDA/NCCL physical acceptance: not run by this CPU workflow.
          EOF
      - name: Upload wheel validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-python-wheel-validation
          path: |
            test_results/refactor_20261120/installed-wheel
            test_results/refactor_20261121/rust-cnot-admission/hosted-run.md
            test_results/refactor_20261121/permutation-acceptance
          if-no-files-found: error
          retention-days: 30
