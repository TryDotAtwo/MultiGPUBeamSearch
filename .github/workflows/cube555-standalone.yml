name: Build Cube555 standalone bundle

on:
  push:
    branches:
      - codex/cube555-standalone-20261122
    paths:
      - examples/cube555-standalone/solve_cube555.py
      - examples/cube555-standalone/README.md
      - .github/workflows/cube555-standalone.yml
      - .github/scripts/check-cube555-public.py

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            examples/cube555-standalone
            .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse the pinned runtime and model assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '45001314619'
          name: cube555-standalone-max-linux-x86_64-py311
          path: ${{ runner.temp }}/previous-bundle
      - name: Replace only the standalone entry point and guide
        shell: bash
        run: |
          archive=cube555-standalone-linux-x86_64-py311.tar
          staging="$RUNNER_TEMP/standalone-staging"
          output="$RUNNER_TEMP/cube555-artifact"
          mkdir -p "$staging" "$output"
          tar -xf "$RUNNER_TEMP/previous-bundle/$archive" -C "$staging"
          rm -- "$RUNNER_TEMP/previous-bundle/$archive"
          cd "$staging/cube555-standalone"
          cp "$GITHUB_WORKSPACE/examples/cube555-standalone/"{solve_cube555.py,README.md} ./
          awk '!/  (README[.]md|solve_cube555[.]py)$/' SHA256SUMS > SHA256SUMS.updated
          sha256sum README.md solve_cube555.py >> SHA256SUMS.updated
          mv -- SHA256SUMS.updated SHA256SUMS
          tar -cf "$output/$archive" -C "$staging" cube555-standalone
          cd "$output"
          sha256sum "$archive" > "$archive.sha256"
      - name: Exercise first install and cold and warm CayleyPy dispatch with networking disabled
        run: |
          cd "$RUNNER_TEMP/standalone-staging/cube555-standalone"
          sudo -n unshare --net -- env PYTHON="$(command -v python3.11)" bash -c '
            bash run.sh --check &&
            .venv/bin/python "$1" "$PWD"
          ' -- "$GITHUB_WORKSPACE/.github/scripts/check-cube555-public.py"
      - uses: actions/upload-artifact@v4
        with:
          name: cube555-standalone-max-linux-x86_64-py311
          path: ${{ runner.temp }}/cube555-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
