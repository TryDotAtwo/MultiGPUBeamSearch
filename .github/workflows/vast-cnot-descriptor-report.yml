name: CNOT descriptor report from Vast

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: vast-cnot-descriptor-61080396
  cancel-in-progress: false

jobs:
  report:
    name: Read remote CNOT descriptor report
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check the existing Vast instance
        id: status
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_INSTANCE_ID: "61080396"
        shell: bash
        run: |
          set -euo pipefail
          instances="${RUNNER_TEMP}/vast-instances.json"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          python3 - "$VAST_INSTANCE_ID" "$instances" "${RUNNER_TEMP}/vast-status.json" "$GITHUB_OUTPUT" <<'PY'
          import datetime, json, re, sys
          instance_id = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as source:
              payload = json.load(source)
          rows = payload.get("instances", []) if isinstance(payload, dict) else payload
          if not isinstance(rows, list):
              raise SystemExit("Unexpected Vast API response shape")
          matches = [r for r in rows if isinstance(r, dict) and str(r.get("id")) == str(instance_id)]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one matching Vast instance")
          row = matches[0]
          def state(*keys):
              for key in keys:
                  value = row.get(key)
                  if isinstance(value, dict):
                      value = value.get("state") or value.get("status")
                  if isinstance(value, str) and value:
                      return re.sub(r"[^A-Za-z0-9 _-]", "", value)[:32]
              return "unknown"
          actual = state("actual_status", "status", "cur_state")
          result = {
              "instance_id": instance_id,
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "actual_status": actual,
              "intended_status": state("intended_status")
          }
          with open(sys.argv[3], "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
              output.write("\n")
          with open(sys.argv[4], "a", encoding="utf-8") as output:
              output.write(f"instance_running={'true' if actual.lower() == 'running' else 'false'}\n")
          PY
      - name: Read only a sanitized descriptor report over SSH
        id: remote
        if: steps.status.outputs.instance_running == 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_INSTANCE_ID: "61080396"
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_ephemeral_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_known_hosts"
          comment="codex-vast-${VAST_INSTANCE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$key_file" "$key_file.pub" "$known_hosts"' EXIT
          ssh-keygen -q -t ed25519 -N "" -C "$comment" -f "$key_file"
          public_key="$(cat "$key_file.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "$request" \
            --output /dev/null \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh"
          instances="${RUNNER_TEMP}/vast-instances.json"
          host="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .public_ipaddr | select(type=="string" and length>0)' "$instances")"
          port="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .ports["22/tcp"][0].HostPort | tostring | select(test("^[0-9]+$"))' "$instances")"
          [[ "$host" =~ ^[0-9.]+$ ]] || { echo "Invalid SSH host returned for the fixed instance." >&2; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port returned for the fixed instance." >&2; exit 1; }
          key_blob="$(awk '{print $2}' "$key_file.pub")"
          ssh_opts=(-i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          ready=false
          for attempt in {1..12}; do
            if ssh "${ssh_opts[@]}" "root@${host}" true >/dev/null 2>"${RUNNER_TEMP}/vast-ssh-connect.err"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "SSH did not become available; no instance state change was attempted." >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/read-descriptor-report.sh" <<'REMOTE'
          set -euo pipefail
          key_blob="$1"
          authorized=/root/.ssh/authorized_keys
          cleanup() {
            if [[ -f "$authorized" ]]; then
              temp="${authorized}.codex.$$"
              awk -v key="$key_blob" '{keep=1; for (i=1; i<=NF; i++) if ($i==key) keep=0; if (keep) print}' "$authorized" > "$temp" || return 0
              chmod --reference="$authorized" "$temp" 2>/dev/null || chmod 600 "$temp"
              chown --reference="$authorized" "$temp" 2>/dev/null || true
              mv "$temp" "$authorized"
            fi
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import datetime, json, re, sys
          from pathlib import Path
          root = Path("/workspace/cnot-device-error-results/green")
          status_path = root / "status.txt"
          log_path = root / "descriptor-2.log"
          patterns = {
              "failed_at": re.compile(r"FAILED_AT=([A-Z0-9_]+)"),
              "exit_code": re.compile(r"\bEXIT=(\d+)\b"),
          }
          markers = {
              "invalid_descriptor": "invalid CNOT physical move",
              "device_side_assert": "device-side assert triggered",
              "async_cuda_assert": "_assert_async_cuda_kernel",
              "nccl_abort": "NCCL operation failed",
              "cnot_success_marker": "CNOT_DEVICE_UNSEEN_OK",
          }
          result = {
              "remote_read": "completed",
              "status_file": {"exists": status_path.is_file()},
              "descriptor_log": {"exists": log_path.is_file()},
              "markers": {name: False for name in markers},
              "failed_at": None,
              "exit_code": None,
          }
          for path, label in ((status_path, "status_file"), (log_path, "descriptor_log")):
              if path.is_file():
                  stat = path.stat()
                  result[label]["size_bytes"] = stat.st_size
                  result[label]["modified_at_utc"] = datetime.datetime.fromtimestamp(
                      stat.st_mtime, datetime.timezone.utc
                  ).isoformat()
          if log_path.is_file():
              for line in log_path.open("r", encoding="utf-8", errors="replace"):
                  for name, marker in markers.items():
                      if marker in line:
                          result["markers"][name] = True
                  for name, pattern in patterns.items():
                      match = pattern.search(line)
                      if match:
                          result[name] = int(match.group(1)) if name == "exit_code" else match.group(1)
          json.dump(result, sys.stdout, separators=(",", ":"))
          sys.stdout.write("\n")
          PY
          REMOTE
          if ! ssh "${ssh_opts[@]}" "root@${host}" "bash -s -- ${key_blob}" \
            < "${RUNNER_TEMP}/read-descriptor-report.sh" \
            > "${RUNNER_TEMP}/vast-descriptor-report.json" \
            2> "${RUNNER_TEMP}/vast-ssh-stderr.txt"; then
            echo "Remote report read failed; the remote log contents were not emitted." >&2
            exit 1
          fi
      - name: Finalize sanitized report
        if: always() && steps.status.outcome == 'success'
        env:
          INSTANCE_RUNNING: ${{ steps.status.outputs.instance_running }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/vast-status.json" "${RUNNER_TEMP}/vast-descriptor-report.json" "${RUNNER_TEMP}/vast-cnot-descriptor-report.json" "$INSTANCE_RUNNING" "$REMOTE_OUTCOME" <<'PY'
          import json, os, sys
          status_path, remote_path, output_path, running, outcome = sys.argv[1:]
          with open(status_path, encoding="utf-8") as source:
              result = json.load(source)
          remote = None
          if os.path.isfile(remote_path) and os.path.getsize(remote_path) > 0:
              try:
                  with open(remote_path, encoding="utf-8") as source:
                      remote = json.load(source)
                  if not isinstance(remote, dict):
                      remote = None
              except (OSError, json.JSONDecodeError):
                  remote = None
          if remote is not None:
              result.update(remote)
          elif running == "true":
              result["remote_read"] = "failed" if outcome in ("failure", "success") else "unavailable"
          else:
              result["remote_read"] = "skipped_instance_not_running"
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
              output.write("\n")
          PY
          jq -r '"Vast instance: \(.instance_id)\nActual status: \(.actual_status)\nRemote read: \(.remote_read)\nDescriptor log found: \(.descriptor_log.exists // false)\nFailure stage: \(.failed_at // "not reported")\nExit code: \(.exit_code // "not reported")"' \
            "${RUNNER_TEMP}/vast-cnot-descriptor-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Sanitized descriptor status report:"
          jq -c '{instance_id,actual_status,intended_status,remote_read,status_file,descriptor_log,failed_at,exit_code,markers}' \
            "${RUNNER_TEMP}/vast-cnot-descriptor-report.json"
      - name: Upload sanitized report
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vast-cnot-descriptor-report
          path: ${{ runner.temp }}/vast-cnot-descriptor-report.json
          if-no-files-found: error
          retention-days: 7
