name: CNOT CPU compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cnot-cpu-validation.yml
      - integrations/cayleypy_native/multigpubeamsearch/cnot.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_cli.py
      - integrations/cayleypy_native/tests/test_cnot_search.py
      - integrations/cayleypy_native/CNOT.md

permissions:
  contents: read

jobs:
  cnot-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run CNOT CPU compatibility tests
        env:
          PYTHONPATH: integrations/cayleypy_native
        run: |
          set -o pipefail
          python -m pytest -q integrations/cayleypy_native/tests/test_cnot_search.py \
            2>&1 | tee "${RUNNER_TEMP}/cnot-search-cpu.log"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnot-cpu-validation
          path: ${{ runner.temp }}/cnot-search-cpu.log
          if-no-files-found: ignore
          retention-days: 7
