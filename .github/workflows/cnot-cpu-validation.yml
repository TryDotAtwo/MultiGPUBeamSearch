name: CNOT CPU compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/cnot-*
      - codex/beam-*
    paths:
      - .github/workflows/cnot-cpu-validation.yml
      - integrations/cayleypy_native/multigpubeamsearch/cnot.py
      - integrations/cayleypy_native/multigpubeamsearch/pipeline_cache.py
      - integrations/cayleypy_native/multigpubeamsearch/pipeline_profiles.py
      - integrations/cayleypy_native/tests/test_pipeline_profiles.py
      - integrations/cayleypy_native/tests/test_pipeline_cache.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_cli.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_collectives.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_stream5.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_rust_stages.py
      - rust/beam-python/src/cnot_native_redistribute.rs
      - integrations/cayleypy_native/multigpubeamsearch/cnot_scorer.py
      - integrations/cayleypy_native/multigpubeamsearch/backend.py
      - integrations/cayleypy_native/multigpubeamsearch/dispatch.py
      - integrations/cayleypy_native/tests/test_search_controls.py
      - integrations/cayleypy_native/tests/test_rust_inference_candidates.py
      - integrations/cayleypy_native/tests/test_rust_inference_cache.py
      - integrations/cayleypy_native/tests/test_rust_inference_selection.py
      - integrations/cayleypy_native/tests/test_rust_persistent_search.py
      - integrations/cayleypy_native/tests/test_cnot_search.py
      - integrations/cayleypy_native/tests/test_cnot_rust_controller.py
      - integrations/cayleypy_native/tests/test_cnot_control_collectives.py
      - integrations/cayleypy_native/tests/test_cnot_rust_exchange.py
      - integrations/cayleypy_native/tests/test_cnot_scorer_runtime_dispatch.py
      - integrations/cayleypy_native/tests/test_cnot_scorer_batch_api.py
      - integrations/cayleypy_native/multigpubeamsearch/rust_control.py
      - integrations/cayleypy_native/multigpubeamsearch/contracts.py
      - integrations/cayleypy_native/tests/test_backend.py
      - integrations/cayleypy_native/tests/test_rust_graph_contract.py
      - integrations/cayleypy_native/tests/cnot_stream5_control_nccl.py
      - cuda/cnot_stream5_bridge.cu
      - integrations/cayleypy_native/CNOT.md
      - Cargo.toml
      - Cargo.lock
      - rust/beam-core/**
      - rust/beam-python/**
      - rust/beam-runtime/**
      - rust/beam-native-sys/**

permissions:
  contents: read

jobs:
  cnot-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest cayleypy==0.1.0
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run Rust CNOT checks
        run: |
          mkdir -p test_results/refactor_20261120/cnot-rust-domain-fallback
          set -o pipefail
          {
            rustfmt --check --edition 2021 \
              rust/beam-runtime/src/cnot_search.rs \
              rust/beam-runtime/src/search_session.rs \
              rust/beam-runtime/src/search_inputs.rs \
              rust/beam-core/src/permutation.rs \
              rust/beam-core/src/search.rs \
              rust/beam-python/src/configuration.rs \
              rust/beam-python/src/cnot.rs \
              rust/beam-python/src/cnot_native_checked.rs \
              rust/beam-python/src/cnot_tqp_scorer.rs \
              rust/beam-python/src/cnot_native_batch.rs \
              rust/beam-python/src/cnot_native_dedup_score.rs \
              rust/beam-python/src/cnot_native_exchange.rs \
              rust/beam-python/src/cnot_native_expand.rs \
              rust/beam-python/src/cnot_native_stages.rs \
              rust/beam-python/src/cnot_scorer_dispatch.rs \
              rust/beam-native-sys/src/cnot_stream5.rs \
              rust/beam-native-sys/src/cnot_tqp_scorer.rs \
              rust/beam-python/src/search_session.rs \
              rust/beam-python/src/cnot_stream5.rs \
              rust/beam-runtime/tests/search_session.rs \
              rust/beam-runtime/tests/session_preparation_identity.rs\
              rust/beam-runtime/tests/search_inputs.rs \
              rust/beam-runtime/tests/cnot_exchange.rs
            rustfmt --check --edition 2021 rust/beam-core/src/inference.rs rust/beam-core/src/cnot.rs rust/beam-core/tests/cnot.rs
            rustfmt --check --edition 2021 rust/beam-python/src/planning.rs
            cargo test --locked -p beam-core --test cnot
            cargo test --locked -p beam-core --test planning
            cargo test --locked -p beam-core --test search
            cargo test --locked -p beam-runtime --test cnot_exchange
            cargo test --locked -p beam-runtime cnot_search
            cargo test --locked -p beam-runtime --test search_session
            cargo test --locked -p beam-runtime --test session_preparation_identity
            cargo test --locked -p beam-runtime --test search_inputs
            cargo test --locked -p beam-native-sys cnot_tqp_scorer
            cargo check --locked -p beam-python
          } 2>&1 | tee test_results/refactor_20261120/cnot-rust-domain-fallback/cnot-rust-cpu.log
      - name: Build PyO3 extension for Python integration tests
        run: |
          cargo build --locked -p beam-python
          cp target/debug/lib_beam_runtime.so \
            integrations/cayleypy_native/multigpubeamsearch/_beam_runtime.so
      - name: Run CNOT CPU compatibility tests
        env:
          PYTHONPATH: integrations/cayleypy_native
        run: |
          set -o pipefail
          python -m pytest -q \
            integrations/cayleypy_native/tests/test_backend.py \
            integrations/cayleypy_native/tests/test_pipeline_cache.py \
            integrations/cayleypy_native/tests/test_pipeline_profiles.py \
            integrations/cayleypy_native/tests/test_rust_graph_contract.py \
            integrations/cayleypy_native/tests/test_search_controls.py \
            integrations/cayleypy_native/tests/test_rust_control.py \
            integrations/cayleypy_native/tests/test_rust_inference_candidates.py \
            integrations/cayleypy_native/tests/test_rust_inference_cache.py \
            integrations/cayleypy_native/tests/test_rust_inference_selection.py \
            integrations/cayleypy_native/tests/test_public_index_sort_build.py \
            integrations/cayleypy_native/tests/test_cnot_search.py \
            integrations/cayleypy_native/tests/test_cnot_control_collectives.py \
            integrations/cayleypy_native/tests/test_cnot_rust_exchange.py \
            integrations/cayleypy_native/tests/test_cnot_stream5_rust.py \
            integrations/cayleypy_native/tests/test_cnot_scorer_runtime_dispatch.py \
            integrations/cayleypy_native/tests/test_cnot_scorer_batch_api.py \
            integrations/cayleypy_native/tests/test_rust_persistent_search.py \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_search_owns_stages_without_python_stage_object \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_search_owns_batch_stages_without_python_helpers \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_cpu_search_applies_children_without_python_tensor_helper \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_cpu_search_deduplicates_without_python_tensor_helper \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_cpu_search_assigns_owners_without_python_tensor_helper \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_top_level_controller_owns_cnot_admission_and_stage_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_controller_prepares_typed_input_without_python_builder \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_native_root_goal_uses_typed_matrix_without_torch_equal\
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_goal_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_history_edge_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_candidate_exchange_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_construction_verification_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_initialization_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_expand_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_deduplicate_score_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_redistribute_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_owns_cnot_selection_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_bypasses_cnot_python_expand \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_bypasses_cnot_python_distinct \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_compatibility_backend_bypasses_cnot_native_route_helper \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_top_level_controller_preserves_compatibility_stage_fallback \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_two_gloo_ranks_coordinate_cnot_setup_failures_and_keep_the_world \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_two_gloo_ranks_coordinate_cnot_selection_failure_after_gather_and_keep_world \
            2>&1 | tee test_results/refactor_20261120/cnot-rust-domain-fallback/cnot-search-cpu.log
      - name: Check the two-rank NCCL probe syntax
        run: |
          python -m py_compile integrations/cayleypy_native/tests/cnot_stream5_control_nccl.py
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnot-rust-domain-fallback-cpu-validation
          path: test_results/refactor_20261120/cnot-rust-domain-fallback
          if-no-files-found: ignore
          retention-days: 7


