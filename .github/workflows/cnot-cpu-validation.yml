name: CNOT CPU compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/cnot-*
    paths:
      - .github/workflows/cnot-cpu-validation.yml
      - integrations/cayleypy_native/multigpubeamsearch/cnot.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_cli.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_collectives.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_stream5.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_rust_stages.py
      - integrations/cayleypy_native/multigpubeamsearch/cnot_scorer.py
      - integrations/cayleypy_native/multigpubeamsearch/backend.py
      - integrations/cayleypy_native/multigpubeamsearch/dispatch.py
      - integrations/cayleypy_native/tests/test_search_controls.py
      - integrations/cayleypy_native/tests/test_cnot_search.py
      - integrations/cayleypy_native/tests/test_cnot_rust_controller.py
      - integrations/cayleypy_native/tests/test_cnot_control_collectives.py
      - integrations/cayleypy_native/tests/test_cnot_rust_exchange.py
      - integrations/cayleypy_native/tests/test_cnot_scorer_runtime_dispatch.py
      - integrations/cayleypy_native/tests/test_cnot_scorer_batch_api.py
      - integrations/cayleypy_native/multigpubeamsearch/rust_control.py
      - integrations/cayleypy_native/multigpubeamsearch/contracts.py
      - integrations/cayleypy_native/tests/test_backend.py
      - integrations/cayleypy_native/tests/test_rust_graph_contract.py
      - integrations/cayleypy_native/tests/cnot_stream5_control_nccl.py
      - cuda/cnot_stream5_bridge.cu
      - integrations/cayleypy_native/CNOT.md
      - Cargo.toml
      - Cargo.lock
      - rust/beam-core/**
      - rust/beam-python/**
      - rust/beam-runtime/**
      - rust/beam-native-sys/**

permissions:
  contents: read

jobs:
  cnot-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest cayleypy==0.1.0
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run Rust CNOT checks
        run: |
          mkdir -p test_results/refactor_20261118/cnot-search-runtime
          set -o pipefail
          {
            rustfmt --check --edition 2021 \
              rust/beam-runtime/src/cnot_search.rs \
              rust/beam-runtime/src/search_session.rs \
              rust/beam-core/src/permutation.rs \
              rust/beam-core/src/search.rs \
              rust/beam-python/src/configuration.rs \
              rust/beam-python/src/cnot.rs \
              rust/beam-python/src/cnot_tqp_scorer.rs \
              rust/beam-python/src/cnot_native_batch.rs \
              rust/beam-python/src/cnot_native_exchange.rs \
              rust/beam-python/src/cnot_native_stages.rs \
              rust/beam-python/src/cnot_scorer_dispatch.rs \
              rust/beam-native-sys/src/cnot_stream5.rs \
              rust/beam-native-sys/src/cnot_tqp_scorer.rs \
              rust/beam-python/src/cnot_stream5.rs
            rustfmt --check --edition 2021 rust/beam-core/src/cnot.rs rust/beam-core/tests/cnot.rs
            cargo test --locked -p beam-core --test cnot
            cargo test --locked -p beam-core --test search
            cargo test --locked -p beam-runtime cnot_search
            cargo test --locked -p beam-native-sys cnot_tqp_scorer
            cargo check --locked -p beam-python
          } 2>&1 | tee test_results/refactor_20261118/cnot-search-runtime/cnot-rust-cpu.log
      - name: Build PyO3 extension for Python integration tests
        run: |
          cargo build --locked -p beam-python
          cp target/debug/lib_beam_runtime.so \
            integrations/cayleypy_native/multigpubeamsearch/_beam_runtime.so
      - name: Run CNOT CPU compatibility tests
        env:
          PYTHONPATH: integrations/cayleypy_native
        run: |
          set -o pipefail
          python -m pytest -q \
            integrations/cayleypy_native/tests/test_backend.py \
            integrations/cayleypy_native/tests/test_rust_graph_contract.py \
            integrations/cayleypy_native/tests/test_search_controls.py \
            integrations/cayleypy_native/tests/test_rust_control.py \
            integrations/cayleypy_native/tests/test_public_index_sort_build.py \
            integrations/cayleypy_native/tests/test_cnot_search.py \
            integrations/cayleypy_native/tests/test_cnot_control_collectives.py \
            integrations/cayleypy_native/tests/test_cnot_rust_exchange.py \
            integrations/cayleypy_native/tests/test_cnot_scorer_runtime_dispatch.py \
            integrations/cayleypy_native/tests/test_cnot_scorer_batch_api.py \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_search_owns_stages_without_python_stage_object \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_search_owns_batch_stages_without_python_helpers \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_top_level_controller_owns_cnot_admission_and_stage_dispatch \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_controller_prepares_typed_input_without_python_builder \
            integrations/cayleypy_native/tests/test_cnot_rust_controller.py::test_rust_top_level_controller_preserves_compatibility_stage_fallback \
            2>&1 | tee test_results/refactor_20261118/cnot-search-runtime/cnot-search-cpu.log
      - name: Check the two-rank NCCL probe syntax
        run: |
          python -m py_compile integrations/cayleypy_native/tests/cnot_stream5_control_nccl.py
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnot-search-runtime-cpu-validation
          path: test_results/refactor_20261118/cnot-search-runtime
          if-no-files-found: ignore
          retention-days: 7

