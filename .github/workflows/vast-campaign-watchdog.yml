name: Vast acceptance emergency stop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - Installed-wheel permutation and CNOT GPU acceptance
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vast-acceptance-external-stop
  cancel-in-progress: false

jobs:
  stop-marked-campaigns:
    name: Stop completed or expired acceptance instances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile labelled campaigns with fresh Vast and GitHub API state
        id: watchdog
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          report="test_results/refactor_20261121/vast-campaign-watchdog/watchdog-${GITHUB_RUN_ID}.json"
          python3 tools/vast_campaign_watchdog.py --report "$report"
          cat "$report"
          python3 - "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = report.get("campaigns", [])
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write("## Vast campaign watchdog\n\n")
              output.write(f"- Marked campaigns inspected: {len(rows)}\n")
              output.write(f"- Confirmed stopped: {sum(bool(row.get('confirmed')) for row in rows)}\n")
              output.write(f"- Errors: {len(report.get('errors', []))}\n")
              output.write("- Stopped instances retain storage billing; this workflow does not delete data.\n")
          PY
      - name: Upload stop/readback evidence
        if: always() && (steps.watchdog.outputs.campaigns_found == 'true' || github.event_name == 'workflow_run' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: vast-campaign-watchdog-${{ github.run_id }}
          path: test_results/refactor_20261121/vast-campaign-watchdog/
          if-no-files-found: warn
          retention-days: 30
