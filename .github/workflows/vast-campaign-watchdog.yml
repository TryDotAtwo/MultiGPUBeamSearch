name: Vast acceptance emergency stop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - Installed-wheel permutation and CNOT GPU acceptance
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vast-acceptance-external-stop
  cancel-in-progress: false

jobs:
  stop-marked-campaigns:
    name: Stop completed or expired acceptance instances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile labelled campaigns with fresh Vast and GitHub API state
        id: watchdog
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/vast-campaign-watchdog-private.json"
          if python3 tools/vast_campaign_watchdog.py --report "$report" >/dev/null 2>&1; then
            echo "watchdog_result=completed" >> "$GITHUB_OUTPUT"
          else
            echo "watchdog_result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Write redacted watchdog status
        if: always()
        env:
          WATCHDOG_OUTCOME: ${{ steps.watchdog.outcome }}
        shell: bash
        run: |
          python3 tools/vast_public_status.py \
            --inventory-query not_run \
            --preflight-outcome skipped \
            --gpu-outcome skipped \
            --cleanup-outcome skipped \
            --watchdog-outcome "$WATCHDOG_OUTCOME" \
            --output "${RUNNER_TEMP}/cnot-public-status.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted watchdog status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vast-watchdog-status-${{ github.run_id }}
          path: ${{ runner.temp }}/cnot-public-status.json
          if-no-files-found: error
          retention-days: 7
