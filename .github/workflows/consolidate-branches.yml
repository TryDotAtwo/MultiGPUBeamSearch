name: Consolidate repository branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidate-branches.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve branch heads and leave only main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/consolidate_repository_branches.py
