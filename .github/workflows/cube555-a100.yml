name: Verify Cube555 standalone on two Vast A100s

on:
  push:
    branches:
      - codex/cube555-standalone-20261122
    paths:
      - .github/workflows/cube555-a100.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cube555-standalone-vast-61944743
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    env:
      CUBE555_BUNDLE_RUN: '45006414821'
      CUBE555_LEASE_LABEL: cube555-a100-profile-grid-20261122
      CUBE555_EXISTING_INSTANCE_ID: '61944743'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the test harness
        run: |
          bash -n .github/scripts/cube555-vast.sh
          bash -n .github/scripts/cube555-a100-host.sh
      - name: Download from GitHub on the node and test cold and warm startup
        timeout-minutes: 215
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cube555-vast.sh
      - name: Verify that the rental has been removed
        if: always()
        timeout-minutes: 4
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: bash .github/scripts/cube555-vast.sh --cleanup
      - name: Save the validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube555-a100-validation
          path: ${{ runner.temp }}/cube555-a100-evidence/
          if-no-files-found: warn
          retention-days: 14
