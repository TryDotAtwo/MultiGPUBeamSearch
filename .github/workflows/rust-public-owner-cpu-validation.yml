name: Rust public owner CPU validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rust-public-owner-cpu-validation.yml
      - integrations/cayleypy_native/multigpubeamsearch/dispatch.py
      - integrations/cayleypy_native/multigpubeamsearch/persistent.py
      - integrations/cayleypy_native/tests/test_rust_default_owner.py
      - integrations/cayleypy_native/tests/test_dispatch.py
      - integrations/cayleypy_native/tests/test_persistent_search.py
      - integrations/cayleypy_native/tests/test_rust_persistent_search.py

permissions:
  contents: read

jobs:
  python-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest cayleypy==0.1.0
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run public owner migration tests
        env:
          PYTHONPATH: integrations/cayleypy_native
        run: |
          mkdir -p test_results/refactor_20261118/rust-public-owner
          set -o pipefail
          python -m pytest -q \
            integrations/cayleypy_native/tests/test_rust_default_owner.py \
            integrations/cayleypy_native/tests/test_dispatch.py \
            integrations/cayleypy_native/tests/test_persistent_search.py \
            integrations/cayleypy_native/tests/test_rust_persistent_search.py \
            2>&1 | tee test_results/refactor_20261118/rust-public-owner/pytest.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-public-owner-cpu-validation
          path: test_results/refactor_20261118/rust-public-owner
          if-no-files-found: ignore
          retention-days: 7
