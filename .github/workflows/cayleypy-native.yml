name: CayleyPy native adapter

on:
  pull_request:
    paths:
      - 'integrations/cayleypy_native/**'
      - 'tools/export_stream1_mlp.py'
      - '.github/workflows/cayleypy-native.yml'
      - 'LICENSE'
  push:
    branches: [main]
    paths:
      - 'integrations/cayleypy_native/**'
      - 'tools/export_stream1_mlp.py'
      - '.github/workflows/cayleypy-native.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies and build distribution
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build pytest
          python -m build integrations/cayleypy_native --outdir dist
          python -m pip install cayleypy==0.1.0
          python -c "from pathlib import Path; import subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',str(next(Path('dist').glob('*.whl')))])"
      - name: Test installed wheel with released CayleyPy
        run: python -I integrations/cayleypy_native/validation/wheel_smoke.py
      - name: Install pinned CayleyPy development API for contract tests
        run: python -m pip install --force-reinstall --no-deps "git+https://github.com/cayleypy/cayleypy.git@28f3841b34009ea8d51bb36eece3dd0be757a145"
      - name: Test installed wheel and adapter contracts
        run: |
          python -I integrations/cayleypy_native/validation/wheel_smoke.py
          python -B -m pytest integrations/cayleypy_native/tests integrations/cayleypy_native/validation/test_smoke_cases.py -q --junitxml=test_results/cayleypy-native-cpu.xml
      - name: Test the public backend hook with an installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps "git+https://github.com/cayleypy/cayleypy.git@b7f5c90ddff3871a1cd0db46dc6ca41bcd4392d3"
          python -I integrations/cayleypy_native/validation/wheel_smoke.py
          python -B -m pytest integrations/cayleypy_native/tests/test_registry.py integrations/cayleypy_native/tests/test_dispatch.py -q
      - name: Verify real source downloads and offline reuse without CUDA
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -I integrations/cayleypy_native/validation/source_setup_smoke.py --cache-dir "${{ runner.temp }}/native-source-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cayleypy-native-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*
            test_results/cayleypy-native-cpu.xml
