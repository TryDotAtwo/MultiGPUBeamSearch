          GPU_OUTCOME: ${{ steps.remote.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          python3 tools/vast_public_status.py \
            --source-outcome "$SOURCE_OUTCOME" \
            --inventory-query "$INVENTORY_QUERY" \
            --preflight-outcome "$PREFLIGHT_OUTCOME" \
            --gpu-outcome "$GPU_OUTCOME" \
            --cleanup-outcome "$CLEANUP_OUTCOME" \
            --watchdog-outcome skipped \
            --output "${RUNNER_TEMP}/cnot-public-status.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted operational status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnot-public-status-${{ github.run_id }}
          path: ${{ runner.temp }}/cnot-public-status.json
          if-no-files-found: error
          retention-days: 7
