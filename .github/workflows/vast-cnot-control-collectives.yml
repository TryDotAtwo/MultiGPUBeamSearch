name: Installed-wheel permutation and CNOT GPU acceptance

on:
  workflow_dispatch:
    inputs:
      spend_cap_usd:
        description: "USD ceiling for this GPU acceptance run. Instance 61080396 must already be running. The workflow never starts or stops it, so a running instance remains billable after the job."
        required: true
        type: string
  push:
    branches:
      - "codex/beam-*"
    paths:
      - .github/workflows/vast-cnot-control-collectives.yml
      - tools/verify_permutation_cuda.py
      - memory/CHANGELOG.md
permissions:
  contents: read

concurrency:
  group: vast-cnot-control-61080396
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate acceptance harness source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the permutation acceptance script
        run: python -m py_compile tools/verify_permutation_cuda.py

  gpu-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-source
    name: Build installed wheel and validate permutation plus checkpoint CNOT on Vast
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      VAST_INSTANCE_ID: "61080396"
      SOURCE_SHA: ${{ github.sha }}
      REMOTE_ROOT: /workspace/codex-beam-gpu-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check existing instance status and the requested GPU spend cap
        id: status
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SPEND_CAP_USD: ${{ inputs.spend_cap_usd }}
        shell: bash
        run: |
          set -euo pipefail
          instances="${RUNNER_TEMP}/vast-instances.json"
          status="${RUNNER_TEMP}/vast-status.json"
          if [[ -z "${VAST_API_KEY}" ]]; then
            echo "VAST_API_KEY repository secret is missing." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          python3 - "$VAST_INSTANCE_ID" "$instances" "$status" "$GITHUB_OUTPUT" "$SPEND_CAP_USD" <<'PY'
          import datetime, json, sys
          from decimal import Decimal, InvalidOperation
          instance_id = int(sys.argv[1])
          try:
              spend_cap = Decimal(sys.argv[5])
          except InvalidOperation:
              raise SystemExit("spend_cap_usd must be a positive decimal USD amount")
          if not spend_cap.is_finite() or spend_cap <= 0:
              raise SystemExit("spend_cap_usd must be a positive decimal USD amount")
          with open(sys.argv[2], encoding="utf-8") as source:
              payload = json.load(source)
          rows = payload.get("instances", []) if isinstance(payload, dict) else payload
          matches = [row for row in rows if isinstance(row, dict) and str(row.get("id")) == str(instance_id)]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one owned Vast instance")
          row = matches[0]
          def state(*names):
              for name in names:
                  value = row.get(name)
                  if isinstance(value, dict):
                      value = value.get("state") or value.get("status")
                  if isinstance(value, str) and value:
                      return value
              return "unknown"
          actual = state("actual_status", "status", "cur_state")
          gpu_name = str(row.get("gpu_name") or "unknown")
          gpu_count = row.get("num_gpus")
          hourly_rate = Decimal(str(row.get("dph_total") or "0"))
          allowed_seconds = 0
          if actual.lower() == "running":
              if gpu_count != 2 or "3060" not in gpu_name:
                  raise SystemExit(f"Expected the existing 2x RTX 3060 instance; found {gpu_count} x {gpu_name}")
              if not hourly_rate.is_finite() or hourly_rate <= 0:
                  raise SystemExit("Vast did not provide a valid hourly instance rate")
              # Reserve 20% of the supplied cap for status checks, transfer, and
              # final artifact upload; the remote workload has its own timeout.
              allowed_seconds = int(spend_cap / hourly_rate * Decimal(3600) * Decimal("0.80"))
              allowed_seconds = min(allowed_seconds, 5400)
              if allowed_seconds < 1200:
                  raise SystemExit("The supplied cap permits less than 20 minutes of GPU work")
          report = {
              "instance_id": instance_id,
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "actual_status": actual,
              "intended_status": state("intended_status"),
              "gpu_name": gpu_name,
              "gpu_count": gpu_count,
              "hourly_rate_usd": str(hourly_rate),
              "spend_cap_usd": str(spend_cap),
              "allowed_runtime_seconds": allowed_seconds,
              "gpu_test": "not_started" if actual.lower() == "running" else "skipped_instance_not_running",
          }
          with open(sys.argv[3], "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2)
              output.write("\n")
          with open(sys.argv[4], "a", encoding="utf-8") as output:
              output.write(f"instance_running={'true' if actual.lower() == 'running' else 'false'}\n")
              output.write(f"allowed_runtime_seconds={allowed_seconds}\n")
          print(f"Instance {instance_id}: {actual}; GPU test: {report['gpu_test']}; allowed GPU runtime: {allowed_seconds}s")
          PY
          if [[ "$(jq -r .gpu_test "$status")" == "skipped_instance_not_running" ]]; then
            echo "No instance state change was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the exact tested source
        if: steps.status.outputs.instance_running == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create code-only source archive, excluding private model inputs
        id: archive
        if: steps.status.outputs.instance_running == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          archive="${RUNNER_TEMP}/beam-gpu-acceptance-${SOURCE_SHA}.tar.gz"
          tar -czf "$archive" CMakeLists.txt Cargo.toml Cargo.lock cmake cuda integrations/cayleypy_native integrations/cnot_scorer native rust src tools
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build the installed wheel and exercise both GPU search domains
        id: remote
        if: steps.status.outputs.instance_running == 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.sha256 }}
          ALLOWED_RUNTIME_SECONDS: ${{ steps.status.outputs.allowed_runtime_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          remote_log="${RUNNER_TEMP}/beam-gpu-acceptance.log"
          trap 'rm -f "$key_file" "$key_file.pub" "$known_hosts"' EXIT
          ssh-keygen -q -t ed25519 -N "" -C "codex-cnot-${VAST_INSTANCE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f "$key_file"
          public_key="$(cat "$key_file.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Content-Type: application/json" --data-binary "$request" --output /dev/null \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh"
          instances="${RUNNER_TEMP}/vast-instances.json"
          host="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .public_ipaddr | select(type=="string" and length>0)' "$instances")"
          port="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .ports["22/tcp"][0].HostPort | tostring | select(test("^[0-9]+$"))' "$instances")"
          [[ "$host" =~ ^[0-9.]+$ ]]
          [[ "$port" =~ ^[0-9]+$ ]]
          key_blob="$(awk '{print $2}' "$key_file.pub")"
          ssh_opts=(-i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          ready=false
          for attempt in {1..12}; do
            if ssh "${ssh_opts[@]}" "root@${host}" true >/dev/null 2>"${RUNNER_TEMP}/vast-cnot-ssh.err"; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo "SSH did not become ready; no instance state change was attempted." >&2; exit 1; }
          remote_archive="${REMOTE_ROOT}.tar.gz"
          ssh "${ssh_opts[@]}" "root@${host}" "cat > '${remote_archive}'" < "$ARCHIVE_PATH"
          cat > "${RUNNER_TEMP}/run-cnot-control.sh" <<'REMOTE'
          set -euo pipefail
          source_dir="$1"
          run_root="$2"
          key_blob="$3"
          remote_archive="$4"
          expected_sha="$5"
          source_sha="$6"
          authorized=/root/.ssh/authorized_keys
          cleanup() {
            if [[ -f "$authorized" ]]; then
              temp="${authorized}.codex.$$"
              awk -v key="$key_blob" '{keep=1; for (i=1; i<=NF; i++) if ($i==key) keep=0; if (keep) print}' "$authorized" > "$temp" || return 0
              chmod --reference="$authorized" "$temp" 2>/dev/null || chmod 600 "$temp"
              chown --reference="$authorized" "$temp" 2>/dev/null || true
              mv "$temp" "$authorized"
            fi
          }
          trap cleanup EXIT
          actual_sha="$(sha256sum "$remote_archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "Transferred source archive SHA-256 mismatch." >&2; exit 1; }
          mkdir -p "$source_dir"
          tar -xzf "$remote_archive" -C "$source_dir"
          rm -f "$remote_archive"
          run_test() {
            set -euo pipefail
            python_bin="$(command -v python3)"
            command -v cargo >/dev/null
            command -v cmake >/dev/null
            command -v git >/dev/null
            [[ -x /usr/local/cuda/bin/nvcc ]]
            upstream="/private/TheQuantumProject"
            manifest="/private/gl4/search-qhat.json"
            [[ -d "$upstream/.git" ]] || { echo "The pinned private scorer checkout is missing on Vast." >&2; exit 1; }
            [[ -f "$manifest" ]] || { echo "The private GL4 checkpoint manifest is missing on Vast." >&2; exit 1; }
            [[ "$(git -C "$upstream" cat-file -t c5b3e3f93b45aa7e533fd2c06209c28ce516ffeb)" == "commit" ]]

            "$python_bin" - <<'PY'
          import torch
          if not torch.cuda.is_available() or torch.cuda.device_count() < 2:
              raise SystemExit("two CUDA devices are required on the existing instance")
          names = [torch.cuda.get_device_name(i) for i in range(2)]
          if any("3060" not in name for name in names):
              raise SystemExit("the physical acceptance target must be two RTX 3060 GPUs")
          print("CUDA_DEVICE_COUNT=" + str(torch.cuda.device_count()))
          print("CUDA_GPU_NAMES=" + repr(names))
          print("TORCH_VERSION=" + str(torch.__version__))
          print("TORCH_CUDA_VERSION=" + str(torch.version.cuda))
          if torch.version.cuda is None:
              raise SystemExit("CUDA-enabled PyTorch is required")
          PY

            export CARGO_TARGET_DIR="${run_root}/cargo-target"
            export PYO3_PYTHON="$python_bin"
            export CUDA_PATH="/usr/local/cuda"
            export CUDACXX="${CUDA_PATH}/bin/nvcc"
            export CNOT103_CUDA_ARCHITECTURES=86
            export LIBTORCH_USE_PYTORCH=1

            wheel_dir="${run_root}/wheel-dist"
            venv="${run_root}/venv"
            mkdir -p "$wheel_dir" "${run_root}/wheel-smoke"
            cd "$source_dir/integrations/cayleypy_native"
            "$python_bin" -m pip wheel --verbose --no-deps --wheel-dir "$wheel_dir" .
            "$python_bin" -m venv --system-site-packages "$venv"
            wheel="$(find "$wheel_dir" -maxdepth 1 -type f -name 'multigpubeamsearch-*.whl' -print -quit)"
            test -n "$wheel"
            wheel_python="${venv}/bin/python"
            "$wheel_python" -m pip install "$wheel"
            "$wheel_python" -m pip check
            cd "${run_root}/wheel-smoke"
            unset PYTHONPATH
            GITHUB_WORKSPACE="$source_dir" "$wheel_python" \
              "$source_dir/integrations/cayleypy_native/tests/installed_wheel_smoke.py"

            scorer_build="${run_root}/private-cnot-scorer"
            "$python_bin" "$source_dir/integrations/cnot_scorer/build.py" \
              --source "$upstream" --build-dir "$scorer_build"
            scorer_library="${scorer_build}/target/release/libcnot103_native.so"
            test -s "$scorer_library"

            domain_build="${run_root}/cnot-owned-domain-build"
            cmake -S "$source_dir" -B "$domain_build" -DCMAKE_BUILD_TYPE=Release \
              -DBEAM_CNOT_OWNED_DOMAIN_ONLY=ON -DBEAM_CUDA_ARCHITECTURES=86
            cmake --build "$domain_build" --target beam_cnot_owned_domain --parallel 2
            domain_library="${domain_build}/libbeam_cnot_owned_domain.so"
            test -s "$domain_library"

            export BEAM_CNOT_OWNED_LIBRARY="$domain_library"
            export MGBS_TQP_LIBRARY="$scorer_library"
            export MGBS_TQP_MANIFEST="$manifest"
            export CNOT_RUST_EVIDENCE="${run_root}/test_results/refactor_20261121/gpu-acceptance/ranks"
            export TORCH_EXTENSIONS_DIR="${run_root}/torch-extensions"
            export RUST_BACKTRACE=1
            mkdir -p "$CNOT_RUST_EVIDENCE"

            result_dir="${run_root}/test_results/refactor_20261121/gpu-acceptance"
            mkdir -p "$result_dir"
            MGBS_TQP_LIBRARY="$scorer_library" MGBS_TQP_MANIFEST="$manifest" \
              "$wheel_python" -m unittest discover \
              -s "$source_dir/integrations/cayleypy_native/tests" -p test_cnot_scorer.py -v

            "$wheel_python" "$source_dir/tools/verify_permutation_cuda.py" \
              --source-dir "$source_dir" --cache-dir "${run_root}/permutation-cache" \
              --output "${result_dir}/permutation-1-and-2-gpu.json"

            CUDA_VISIBLE_DEVICES=0 "$wheel_python" -m torch.distributed.run --standalone --nproc_per_node=1 \
              "$source_dir/tools/verify_cnot.py" --case trained --backend nccl --mode qhat \
              --engine rust --require-rust-scorer --library "$scorer_library" --manifest "$manifest" \
              --output "${result_dir}/cnot-trained-1-gpu.json"

            CUDA_VISIBLE_DEVICES=0,1 "$wheel_python" -m torch.distributed.run --standalone --nproc_per_node=2 \
              "$source_dir/tools/verify_cnot.py" --case trained-deep --backend nccl --mode proposal \
              --engine rust --require-rust-scorer --library "$scorer_library" --manifest "$manifest" \
              --output "${result_dir}/cnot-trained-2-gpu.json"

            "$wheel_python" -m torch.distributed.run --standalone --nproc_per_node=2 \
              "$source_dir/integrations/cayleypy_native/tests/cnot_stream5_control_nccl.py"
            "$wheel_python" -m torch.distributed.run --standalone --nproc_per_node=2 \
              "$source_dir/integrations/cayleypy_native/tests/cnot_device_unseen_distributed.py"

            "$wheel_python" - "${result_dir}" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = "92f3ec8e6a6ef831916a9d3ba9bbdae9307c9850d61334916a2b3e690c0020c4"
          for name in ("cnot-trained-1-gpu.json", "cnot-trained-2-gpu.json"):
              report = json.loads((root / name).read_text(encoding="utf-8"))
              actual = report.get("model", {}).get("checkpoint_sha256")
              if actual != expected:
                  raise SystemExit(f"{name}: unexpected checkpoint SHA-256 {actual!r}")
              if report.get("engine") != "rust" or not report.get("bitwise_replay"):
                  raise SystemExit(f"{name}: Rust controller or replay evidence missing")
          permutation = json.loads((root / "permutation-1-and-2-gpu.json").read_text(encoding="utf-8"))
          if [row.get("world_size") for row in permutation.get("runs", [])] != [1, 2]:
              raise SystemExit("permutation one- and two-GPU results are missing")
          print(json.dumps({
              "checkpoint_sha256": expected,
              "permutation_world_sizes": [1, 2],
              "cnot_world_sizes": [1, 2],
              "rust_controller": True,
              "installed_wheel": True,
          }, separators=(",", ":")))
          PY
          }

          log_dir="${run_root}/test_results/refactor_20261121/gpu-acceptance"
          mkdir -p "$log_dir"
          run_test 2>&1 | tee "${log_dir}/cuda-nccl.log"
          control_marker_count="$(grep -c 'CNOT_CONTROL_COLLECTIVES_OK' "${log_dir}/cuda-nccl.log")"
          descriptor_marker_count="$(grep -c 'CNOT_DEVICE_UNSEEN_OK' "${log_dir}/cuda-nccl.log")"
          checkpoint_report_count="$(grep -c 'checkpoint_sha256.*92f3ec8e6a6ef831916a9d3ba9bbdae9307c9850d61334916a2b3e690c0020c4' "${log_dir}/cuda-nccl.log")"
          [[ "$control_marker_count" == 2 ]]
          [[ "$descriptor_marker_count" == 2 ]]
          [[ "$checkpoint_report_count" -ge 2 ]]
          printf '{"source_sha":"%s","gpu_test":"passed","control_rank_markers":%s,"descriptor_rank_markers":%s,"checkpoint_sha256":"%s"}\n' \
            "$source_sha" "$control_marker_count" "$descriptor_marker_count" "92f3ec8e6a6ef831916a9d3ba9bbdae9307c9850d61334916a2b3e690c0020c4" > "${log_dir}/receipt.json"
          cat "${log_dir}/receipt.json"
          REMOTE
          if ! ssh "${ssh_opts[@]}" "root@${host}" \
            "timeout --signal=TERM --kill-after=60s '${ALLOWED_RUNTIME_SECONDS}s' bash -s -- '${REMOTE_ROOT}/source' '${REMOTE_ROOT}' '${key_blob}' '${remote_archive}' '${ARCHIVE_SHA}' '${SOURCE_SHA}'" \
            < "${RUNNER_TEMP}/run-cnot-control.sh" > "$remote_log" 2>&1; then
            tail -n 100 "$remote_log"
            exit 1
          fi
          cat "$remote_log"
          control_marker_count="$(grep -c 'CNOT_CONTROL_COLLECTIVES_OK' "$remote_log")"
          descriptor_marker_count="$(grep -c 'CNOT_DEVICE_UNSEEN_OK' "$remote_log")"
          [[ "$control_marker_count" == 2 ]]
          [[ "$descriptor_marker_count" == 2 ]]
          jq --arg sha "$SOURCE_SHA" --arg log "$remote_log" \
            '.gpu_test="passed" | .source_sha=$sha | .control_rank_markers=2 | .descriptor_rank_markers=2 | .runner_log=$log' \
            "${RUNNER_TEMP}/vast-status.json" > "${RUNNER_TEMP}/vast-status-passed.json"
          mv "${RUNNER_TEMP}/vast-status-passed.json" "${RUNNER_TEMP}/vast-status.json"
      - name: Report a stopped instance without starting it
        if: steps.status.outputs.instance_running != 'true'
        shell: bash
        run: |
          echo "GPU acceptance skipped: instance 61080396 is not already running. No start, stop, or rent request was made." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized status and remote test log
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vast-beam-gpu-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vast-status.json
            ${{ runner.temp }}/beam-gpu-acceptance.log
          if-no-files-found: warn
          retention-days: 7
