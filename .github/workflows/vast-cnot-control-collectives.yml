name: Installed-wheel permutation and CNOT GPU acceptance

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Decimal ID of the new, account-owned 2x desktop RTX 3060 instance. The legacy ID is prohibited."
        required: true
        type: string
      spend_cap_usd:
        description: "Lifetime USD ceiling, including elapsed time since Vast start_date (maximum $10)."
        required: true
        type: string
  push:
    branches:
      - "codex/beam-*"
    paths:
      - .github/workflows/vast-cnot-control-collectives.yml
      - tools/verify_permutation_cuda.py
      - tools/vast_instance_contract.py
      - tools/test_vast_instance_contract.py
      - tools/vast_private_preflight.py
      - tools/test_vast_private_preflight.py
      - tools/vast_result_transport.sh
      - tools/test_vast_result_transport.py
      - memory/CHANGELOG.md
permissions:
  contents: read

concurrency:
  group: vast-cnot-control-${{ inputs.instance_id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate acceptance harness on hosted CPU
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source-only acceptance helpers
        id: compile_source
        run: python -m py_compile tools/verify_permutation_cuda.py tools/test_vast_result_transport.py tools/vast_instance_contract.py tools/test_vast_instance_contract.py tools/vast_private_preflight.py tools/test_vast_private_preflight.py
      - name: Test target identity, hardware and lifetime budget with API fixtures
        id: instance_contract
        run: python tools/test_vast_instance_contract.py -v
      - name: Test private manifest and checkpoint receipt parsing
        id: private_receipt_test
        run: python tools/test_vast_private_preflight.py -v
      - name: Test result retrieval after SSH key revocation
        id: transport_test
        run: python tools/test_vast_result_transport.py -v
      - name: Syntax-check embedded remote Bash and Python payloads
        id: syntax_check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          source = Path(".github/workflows/vast-cnot-control-collectives.yml").read_text(encoding="utf-8")
          marker = 'cat > "${RUNNER_TEMP}/run-cnot-control.sh" <<\'REMOTE\'\n'
          start = source.index(marker) + len(marker)
          end = source.index("\n          REMOTE\n", start)
          lines = source[start:end].splitlines()
          for number, line in enumerate(lines, 1):
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected indentation in remote payload line {number}")
              if line:
                  lines[number - 1] = line[10:]
          payload = Path(os.environ["RUNNER_TEMP"]) / "vast-remote-payload.sh"
          payload_text = "\n".join(lines) + "\n"
          payload.write_text(payload_text, encoding="utf-8")
          subprocess.run(["bash", "-n", str(payload)], check=True)
          archive_command = 'tar -czf "$archive" CMakeLists.txt Cargo.toml Cargo.lock cmake cuda integrations/cayleypy_native integrations/cnot_scorer native rust src tools tests'
          if archive_command not in source:
              raise SystemExit("the remote source archive must include root CMake test sources")
          for required in (
              'instance_id="$7"',
              'manifest_sha="$8"',
              'checkpoint_sha="$9"',
              'MGBS_CNOT_STRICT_BACKEND=1',
              'MGBS_CNOT_OWNED_LIBRARY="$domain_library"',
              'BEAM_CNOT_OWNED_LIBRARY="$domain_library"',
              'CNOT_RUST_STREAM5_ACTIVE',
          ):
              if required not in source and required not in payload_text:
                  raise SystemExit(f"missing acceptance contract: {required}")
          if "bash tools/vast_result_transport.sh" not in source:
              raise SystemExit("the GPU workflow must use the tested retained SSH control master")
          if "ControlMaster=yes -MNf" not in Path("tools/vast_result_transport.sh").read_text(encoding="utf-8"):
              raise SystemExit("result retrieval must reuse the authenticated ControlMaster")
          if "timeout --signal=TERM --kill-after=60s" not in Path("tools/vast_result_transport.sh").read_text(encoding="utf-8"):
              raise SystemExit("the remote test needs a bounded runtime")
          if not payload_text.startswith("set -euo pipefail") or 'instance_id="$7"' not in payload_text:
              raise SystemExit("the remote acceptance payload or selected instance ID was not extracted")
          lines = source.splitlines()
          heredoc_count = 0
          index = 0
          marker = "<" * 2 + "'" + "PY" + "'"
          while index < len(lines):
              if marker not in lines[index]:
                  index += 1
                  continue
              index += 1
              body = []
              while index < len(lines) and lines[index].strip() != "PY":
                  line = lines[index]
                  if line and not line.startswith("          "):
                      raise SystemExit(f"unexpected Python heredoc indentation at workflow line {index + 1}")
                  body.append(line[10:] if line else "")
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated Python heredoc")
              compile("\n".join(body) + "\n", f"<workflow-python-heredoc-{heredoc_count}>", "exec")
              heredoc_count += 1
              index += 1
          if heredoc_count < 5:
              raise SystemExit(f"expected embedded Python checks, found {heredoc_count}")
          PY
      - name: Write source validation receipt
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile_source.outcome }}
          INSTANCE_CONTRACT_OUTCOME: ${{ steps.instance_contract.outcome }}
          PRIVATE_RECEIPT_OUTCOME: ${{ steps.private_receipt_test.outcome }}
          TRANSPORT_OUTCOME: ${{ steps.transport_test.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax_check.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gpu-acceptance-source"
          cat > "${RUNNER_TEMP}/gpu-acceptance-source/GITHUB_STATUS.md" <<EOF
          # Hosted CPU source validation

          - Commit: ${GITHUB_SHA}
          - Python source compile: ${COMPILE_OUTCOME}
          - New 2x RTX 3060 target and elapsed-cost contract: ${INSTANCE_CONTRACT_OUTCOME}
          - Pinned private manifest/checkpoint receipt parser: ${PRIVATE_RECEIPT_OUTCOME}
          - Fake SSH result retrieval after key revocation, on success and failure: ${TRANSPORT_OUTCOME}
          - Remote Bash and embedded Python syntax: ${SYNTAX_OUTCOME}
          - This receipt does not claim CUDA, NCCL, or private-checkpoint acceptance.
          EOF
      - name: Upload source validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-acceptance-source-${{ github.run_id }}
          path: ${{ runner.temp }}/gpu-acceptance-source/GITHUB_STATUS.md
          if-no-files-found: error
          retention-days: 30

  gpu-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-source
    name: Build installed wheel and run Rust permutation plus CNOT acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      VAST_INSTANCE_ID: ${{ inputs.instance_id }}
      SOURCE_SHA: ${{ github.sha }}
      REMOTE_ROOT: /workspace/codex-beam-gpu-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read back and validate the selected Vast instance and lifetime cap
        id: preflight
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SPEND_CAP_USD: ${{ inputs.spend_cap_usd }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VAST_API_KEY" ]] || { echo "VAST_API_KEY repository secret is missing." >&2; exit 1; }
          instances="${RUNNER_TEMP}/vast-instances.json"
          status="${RUNNER_TEMP}/vast-status.json"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          python3 tools/vast_instance_contract.py \
            --payload "$instances" --instance-id "$VAST_INSTANCE_ID" \
            --spend-cap-usd "$SPEND_CAP_USD" --report "$status" --github-output "$GITHUB_OUTPUT"
          cat "$status"
      - name: Attach a one-time SSH key to the validated target
        if: steps.preflight.outputs.instance_running == 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SSH_HOST: ${{ steps.preflight.outputs.ssh_host }}
          SSH_PORT: ${{ steps.preflight.outputs.ssh_port }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          ssh-keygen -q -t ed25519 -N "" -C "codex-cnot-${VAST_INSTANCE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f "$key_file"
          public_key="$(cat "${key_file}.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Content-Type: application/json" \
            --data-binary "$request" \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh" >/dev/null
          echo "One-time key attached only to validated instance ${VAST_INSTANCE_ID}." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private source, checkpoint, GPU stack and disk before upload or build
        id: privatepreflight
        if: steps.preflight.outputs.instance_running == 'true'
        timeout-minutes: 5
        env:
          SSH_HOST: ${{ steps.preflight.outputs.ssh_host }}
          SSH_PORT: ${{ steps.preflight.outputs.ssh_port }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          remote_log="${RUNNER_TEMP}/vast-private-preflight.log"
          ssh_opts=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          ready=false
          for attempt in {1..12}; do
            if ssh "${ssh_opts[@]}" "root@${SSH_HOST}" true >/dev/null 2>"${RUNNER_TEMP}/vast-cnot-ssh.err"; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo "SSH did not become ready on validated target ${VAST_INSTANCE_ID}." >&2; exit 1; }
          timeout 180 ssh "${ssh_opts[@]}" "root@${SSH_HOST}" 'bash -s' <<'REMOTE_PREFLIGHT' 2>&1 | tee "$remote_log"
          set -euo pipefail
          upstream=/private/TheQuantumProject
          gl4=/private/gl4
          manifest="$gl4/search-qhat.json"
          expected_upstream=c5b3e3f93b45aa7e533fd2c06209c28ce516ffeb
          expected_checkpoint=92f3ec8e6a6ef831916a9d3ba9bbdae9307c9850d61334916a2b3e690c0020c4
          [[ -d "$upstream/.git" ]]
          [[ "$(git -C "$upstream" rev-parse HEAD)" == "$expected_upstream" ]]
          for path in "$manifest" "$gl4/run.json" "$gl4/training-result.json" \
                      "$gl4/dataset.json" "$gl4/dataset.sha256" \
                      "$gl4/catalogs.json" "$gl4/catalogs.sha256"; do
            [[ -s "$path" ]] || { echo "Missing private GL4 input: $path" >&2; exit 1; }
          done
          (cd "$gl4" && sha256sum -c dataset.sha256 && sha256sum -c catalogs.sha256)
          mapfile -d '' checkpoints < <(find "$gl4/checkpoint" -maxdepth 1 -type f -name 'step-*.qcp' -print0)
          matches=()
          for checkpoint in "${checkpoints[@]}"; do
            hash="$(sha256sum "$checkpoint" | awk '{print $1}')"
            [[ "$hash" == "$expected_checkpoint" ]] && matches+=("$checkpoint")
          done
          [[ "${#matches[@]}" == 1 ]] || { echo "Expected exactly one checkpoint with the pinned SHA-256." >&2; exit 1; }
          python3 - "$manifest" "$gl4/training-result.json" "${matches[0]}" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          result_path = pathlib.Path(sys.argv[2])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          checkpoint = pathlib.Path(sys.argv[3]).resolve()
          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from strings(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from strings(item)
          references = [value for value in strings(result) if value.endswith(".qcp")]
          if not references:
              raise SystemExit("training-result.json does not name a .qcp checkpoint")
          roots = [result_path.parent, result_path.parent.parent]
          resolved = set()
          for reference in references:
              candidate = pathlib.Path(reference)
              resolved.update((root / candidate).resolve() for root in roots)
          if checkpoint not in resolved:
              raise SystemExit("the pinned checkpoint is not the one named by training-result.json")
          if manifest.get("schema") != "cnot103_dev_search_v1":
              raise SystemExit("the GL4 search manifest has an unexpected schema")
          PY
          for tool in python3 git cmake ninja cargo rustc cc nvcc; do command -v "$tool" >/dev/null; done
          python3 - <<'PY'
          import json, re, subprocess, torch
          if torch.__version__.split("+")[0] != "2.9.0":
              raise SystemExit(f"expected PyTorch 2.9.0, found {torch.__version__}")
          if not torch.cuda.is_available() or torch.cuda.device_count() != 2:
              raise SystemExit("exactly two visible CUDA GPUs are required")
          names = [torch.cuda.get_device_name(index) for index in range(2)]
          for name in names:
              normalized = name.upper()
              if "RTX 3060" not in normalized or any(token in normalized for token in ("TI", "LAPTOP", "MOBILE", "SUPER")):
                  raise SystemExit(f"expected desktop RTX 3060 GPUs, found {names!r}")
          cuda_version = torch.version.cuda
          if cuda_version is None:
              raise SystemExit("installed PyTorch was built without CUDA")
          output = subprocess.check_output(["nvcc", "--version"], text=True)
          match = re.search(r"release ([0-9]+\.[0-9]+)", output)
          if not match or match.group(1) != cuda_version:
              raise SystemExit(f"nvcc {match.group(1) if match else 'unknown'} != PyTorch CUDA {cuda_version}")
          if not hasattr(torch.cuda, "nccl") or torch.cuda.nccl.version() is None:
              raise SystemExit("PyTorch NCCL support is unavailable")
          print("REMOTE_GPU_STACK=" + json.dumps({
              "torch": torch.__version__, "torch_cuda": cuda_version,
              "nccl": torch.cuda.nccl.version(), "gpus": names,
              "cmake": subprocess.check_output(["cmake", "--version"], text=True).splitlines()[0],
              "ninja": subprocess.check_output(["ninja", "--version"], text=True).strip(),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
          }, sort_keys=True))
          PY
          df -Pk /workspace /private
          free_kib="$(df -Pk /workspace | awk 'NR==2 {print $4}')"
          [[ "$free_kib" =~ ^[0-9]+$ && "$free_kib" -ge 15728640 ]] || { echo "At least 15 GiB must be free in /workspace before build." >&2; exit 1; }
          printf 'REMOTE_PRIVATE_PREFLIGHT_OK upstream=%s manifest_sha256=%s checkpoint_sha256=%s\n' \
            "$expected_upstream" "$(sha256sum "$manifest" | awk '{print $1}')" "$expected_checkpoint"
          REMOTE_PREFLIGHT
          python3 tools/vast_private_preflight.py --log "$remote_log" \
            --github-output "$GITHUB_OUTPUT" --report "${RUNNER_TEMP}/vast-status.json"
      - name: Create the code-only source archive after private preflight passes
        id: archive
        if: steps.preflight.outputs.instance_running == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          archive="${RUNNER_TEMP}/beam-gpu-acceptance-${SOURCE_SHA}.tar.gz"
          tar -czf "$archive" CMakeLists.txt Cargo.toml Cargo.lock cmake cuda integrations/cayleypy_native integrations/cnot_scorer native rust src tools tests
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build installed wheel and run bounded CUDA/NCCL acceptance
        id: remote
        if: steps.preflight.outputs.instance_running == 'true'
        timeout-minutes: 95
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.sha256 }}
          SSH_HOST: ${{ steps.preflight.outputs.ssh_host }}
          SSH_PORT: ${{ steps.preflight.outputs.ssh_port }}
          ALLOWED_RUNTIME_SECONDS: ${{ steps.preflight.outputs.allowed_runtime_seconds }}
          MANIFEST_SHA256: ${{ steps.privatepreflight.outputs.manifest_sha256 }}
          CHECKPOINT_SHA256: ${{ steps.privatepreflight.outputs.checkpoint_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          remote_log="${RUNNER_TEMP}/beam-gpu-acceptance.log"
          result_archive="${RUNNER_TEMP}/beam-gpu-acceptance-test-results.tar.gz"
          ssh_opts=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          remote_archive="${REMOTE_ROOT}.tar.gz"
          timeout 900 ssh "${ssh_opts[@]}" "root@${SSH_HOST}" "cat > '${remote_archive}'" < "$ARCHIVE_PATH"
          cat > "${RUNNER_TEMP}/run-cnot-control.sh" <<'REMOTE'
          set -euo pipefail
          source_dir="$1"
          run_root="$2"
          key_blob="$3"
          remote_archive="$4"
          expected_sha="$5"
          source_sha="$6"
          instance_id="$7"
          manifest_sha="$8"
          checkpoint_sha="$9"
          [[ "$instance_id" =~ ^[1-9][0-9]*$ && "$instance_id" != "61080396" ]] || { echo "invalid or prohibited Vast instance ID" >&2; exit 2; }
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ && "$checkpoint_sha" == "92f3ec8e6a6ef831916a9d3ba9bbdae9307c9850d61334916a2b3e690c0020c4" ]] || { echo "invalid private manifest or checkpoint receipt" >&2; exit 2; }
          authorized=/root/.ssh/authorized_keys
          cleanup() {
            if [[ -f "$authorized" ]]; then
              temp="${authorized}.codex.$$"
              awk -v key="$key_blob" '{keep=1; for (i=1; i<=NF; i++) if ($i==key) keep=0; if (keep) print}' "$authorized" > "$temp" || return 0
              chmod --reference="$authorized" "$temp" 2>/dev/null || chmod 600 "$temp"
              chown --reference="$authorized" "$temp" 2>/dev/null || true
              mv "$temp" "$authorized"
            fi
          }
          trap cleanup EXIT
          actual_sha="$(sha256sum "$remote_archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "Transferred source archive SHA-256 mismatch." >&2; exit 1; }
          mkdir -p "$source_dir"
          tar -xzf "$remote_archive" -C "$source_dir"
          rm -f "$remote_archive"
          run_test() {
            set -euo pipefail
            python_bin="$(command -v python3)"
            command -v cargo >/dev/null
            command -v cmake >/dev/null
            command -v ninja >/dev/null
            command -v git >/dev/null
            [[ -x /usr/local/cuda/bin/nvcc ]]
            upstream=/private/TheQuantumProject
            manifest=/private/gl4/search-qhat.json
            expected_upstream=c5b3e3f93b45aa7e533fd2c06209c28ce516ffeb
            expected_checkpoint="$checkpoint_sha"
            [[ "$(git -C "$upstream" rev-parse HEAD)" == "$expected_upstream" ]]
            [[ -s "$manifest" ]]
            actual_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
            [[ "$actual_manifest_sha" == "$manifest_sha" ]] || { echo "private search manifest changed after preflight" >&2; exit 1; }
            [[ "$(find /private/gl4/checkpoint -maxdepth 1 -type f -name 'step-*.qcp' -exec sha256sum {} + | awk -v expected="$expected_checkpoint" '$1==expected {n++} END {print n+0}')" == 1 ]]
            "$python_bin" - <<'PY'
          import re, subprocess, torch
          if torch.__version__.split("+")[0] != "2.9.0" or torch.version.cuda is None:
              raise SystemExit("the installed CUDA PyTorch 2.9.0 stack is required")
          if not torch.cuda.is_available() or torch.cuda.device_count() < 2:
              raise SystemExit("two CUDA devices are required on the verified instance")
          names = [torch.cuda.get_device_name(i) for i in range(2)]
          if any("RTX 3060" not in name.upper() or "TI" in name.upper() for name in names):
              raise SystemExit(f"expected two desktop RTX 3060 GPUs, found {names!r}")
          cuda = re.search(r"release ([0-9]+\.[0-9]+)", subprocess.check_output(["nvcc", "--version"], text=True))
          if not cuda or cuda.group(1) != torch.version.cuda or torch.cuda.nccl.version() is None:
              raise SystemExit("nvcc, PyTorch CUDA and NCCL versions are incompatible")
          print(f"CUDA_DEVICE_COUNT={torch.cuda.device_count()} GPU_NAMES={names!r} TORCH={torch.__version__} CUDA={torch.version.cuda} NCCL={torch.cuda.nccl.version()}")
          PY
            export CARGO_TARGET_DIR="${run_root}/cargo-target"
            export PYO3_PYTHON="$python_bin"
            export CUDA_PATH=/usr/local/cuda
            export CUDACXX="${CUDA_PATH}/bin/nvcc"
            export CMAKE_GENERATOR=Ninja
            export CNOT103_CUDA_ARCHITECTURES=86
            export LIBTORCH_USE_PYTORCH=1
            wheel_dir="${run_root}/wheel-dist"
            venv="${run_root}/venv"
            result_dir="${run_root}/test_results/refactor_20261121/gpu-acceptance"
            mkdir -p "$wheel_dir" "${run_root}/wheel-smoke" "$result_dir"
            cd "$source_dir/integrations/cayleypy_native"
            "$python_bin" -m pip wheel --verbose --no-deps --wheel-dir "$wheel_dir" .
            "$python_bin" -m venv --system-site-packages "$venv"
            wheel="$(find "$wheel_dir" -maxdepth 1 -type f -name 'multigpubeamsearch-*.whl' -print -quit)"
            test -n "$wheel"
            wheel_sha256="$(sha256sum "$wheel" | awk '{print $1}')"
            python3 - "$result_dir/receipt.json" "$wheel_sha256" <<'PY'
          import json, pathlib, sys
          receipt_path = pathlib.Path(sys.argv[1])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          receipt["wheel_sha256"] = sys.argv[2]
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            wheel_python="${venv}/bin/python"
            "$wheel_python" -m pip install --force-reinstall --no-deps "$wheel"
            "$wheel_python" - "$venv" <<'PY'
          import sys
          from pathlib import Path
          import multigpubeamsearch
          venv = Path(sys.argv[1]).resolve()
          module_path = Path(multigpubeamsearch.__file__).resolve()
          if not module_path.is_relative_to(venv):
              raise SystemExit(f"wheel import escaped the acceptance venv: {module_path}")
          print("INSTALLED_PACKAGE_PATH=" + str(module_path))
          PY
            "$wheel_python" -m pip check
            cd "${run_root}/wheel-smoke"
            unset PYTHONPATH
            GITHUB_WORKSPACE="$source_dir" "$wheel_python" "$source_dir/integrations/cayleypy_native/tests/installed_wheel_smoke.py"

            scorer_build="${run_root}/private-cnot-scorer"
            "$python_bin" "$source_dir/integrations/cnot_scorer/build.py" --source "$upstream" --build-dir "$scorer_build"
            scorer_library="${scorer_build}/target/release/libcnot103_native.so"
            test -s "$scorer_library"
