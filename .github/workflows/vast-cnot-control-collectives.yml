name: Installed-wheel permutation and CNOT GPU acceptance
run-name: CNOT GPU acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/beam-*"
    paths:
      - .github/workflows/vast-cnot-control-collectives.yml
      - .github/workflows/installed-wheel-validation.yml
      - CMakeLists.txt
      - tools/production_runner.cu
      - tools/verify_permutation_cuda.py
      - tools/permutation_acceptance.py
      - tools/test_permutation_acceptance.py
      - tools/vast_cnot_gpu_acceptance.sh
      - tools/verify_cnot.py
      - tools/cnot_acceptance_events.py
      - tools/test_cnot_acceptance_events.py
      - tools/test_cnot_gpu_identity.py
      - tools/verify_cnot_gpu_pair.py
      - tools/test_verify_cnot_gpu_pair.py
      - tools/fixtures/cnot_acceptance_event_v1.jsonl
      - tools/vast_instance_contract.py
      - tools/test_vast_instance_contract.py
      - tools/vast_budget_deadline.py
      - tools/test_vast_budget_deadline.py
      - tools/vast_campaign_guard.py
      - tools/test_vast_campaign_guard.py
      - tools/vast_campaign_watchdog.py
      - tools/test_vast_campaign_watchdog.py
      - tools/test_vast_campaign_workflow.py
      - tools/validate_cnot_handoff.py
      - tools/test_validate_cnot_handoff.py
      - integrations/cnot_scorer/**
      - integrations/cayleypy_native/tests/installed_cnot_handoff_endpoint.py
      - tools/cnot_producer_source_gate.py
      - tools/test_cnot_producer_source_gate.py
      - tools/vast_public_status.py
      - tools/test_vast_public_status.py
      - .github/workflows/vast-campaign-watchdog.yml
      - tools/vast_private_preflight.py
      - tools/test_vast_private_preflight.py
      - tools/vast_result_transport.sh
      - tools/test_vast_result_transport.py
      - tools/test_vast_source_archive.py
      - tools/create_vast_source_archive.py
      - tools/vast_cnot_panel_cli_args.sh
      - tools/test_vast_cnot_panel_cli_args.py
      - tools/vast_cnot_gpu_acceptance.sh
      - integrations/cayleypy_native/tests/test_build.py
      - integrations/cayleypy_native/multigpubeamsearch/build.py
      - integrations/cayleypy_native/multigpubeamsearch/native_source_manifest.json
      - integrations/cayleypy_native/build_backend.py
      - integrations/cayleypy_native/pyproject.toml
      - integrations/cayleypy_native/tests/installed_verify_cnot_gloo_lifecycle.py
      - rust/beam-**
      - integrations/cayleypy_native/multigpubeamsearch/cnot*.py
      - integrations/cayleypy_native/multigpubeamsearch/gpu_identity.py
permissions:
  contents: read

concurrency:
  group: vast-cnot-control-acceptance
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate acceptance harness on hosted CPU
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source-only acceptance helpers
        id: compile_source
        run: python -m py_compile tools/verify_permutation_cuda.py tools/permutation_acceptance.py tools/test_permutation_acceptance.py tools/verify_cnot.py tools/cnot_acceptance_events.py tools/test_cnot_acceptance_events.py tools/test_cnot_gpu_identity.py tools/verify_cnot_gpu_pair.py tools/test_verify_cnot_gpu_pair.py tools/test_vast_result_transport.py tools/vast_public_status.py tools/test_vast_public_status.py tools/test_vast_source_archive.py tools/create_vast_source_archive.py tools/vast_instance_contract.py tools/test_vast_instance_contract.py tools/vast_budget_deadline.py tools/test_vast_budget_deadline.py tools/vast_campaign_guard.py tools/test_vast_campaign_guard.py tools/vast_campaign_watchdog.py tools/test_vast_campaign_watchdog.py tools/test_vast_campaign_workflow.py tools/validate_cnot_handoff.py tools/test_validate_cnot_handoff.py tools/cnot_producer_source_gate.py tools/test_cnot_producer_source_gate.py tools/vast_private_preflight.py tools/test_vast_private_preflight.py integrations/cayleypy_native/tests/installed_verify_cnot_gloo_lifecycle.py integrations/cayleypy_native/multigpubeamsearch/gpu_identity.py tools/test_vast_cnot_panel_cli_args.py && bash -n tools/vast_cnot_panel_cli_args.sh
      - name: Test exact producer-source gate
        if: always()
        id: producer_source_gate_test
        run: python tools/test_cnot_producer_source_gate.py -v
      - name: Test private CNOT handoff resolution and preflight summary
        if: always()
        id: cnot_handoff_preflight_test
        run: python tools/test_validate_cnot_handoff.py -v
      - name: Test private result transport boundary
        if: always()
        id: private_transport
        run: python tools/test_vast_result_transport.py -v
      - name: Test allowlisted public status receipt
        id: public_status
        if: always()
        run: python tools/test_vast_public_status.py -v
      - name: Test redacted public reporting contract
        id: public_redaction
        if: always()
        run: python tools/test_vast_campaign_workflow.py -v
      - name: Test the versioned per-invocation CNOT event verifier
        if: always()
        id: cnot_event_verifier
        run: python tools/test_cnot_acceptance_events.py -v
      - name: Test paired CNOT campaign receipt binding
        if: always()
        id: cnot_pair_verifier
        run: python tools/test_verify_cnot_gpu_pair.py -v
      - name: Test physical GPU UUID selection with a CPU fake driver
        if: always()
        id: cnot_gpu_identity
        run: python tools/test_cnot_gpu_identity.py -v
      - name: Test target identity, hardware and lifetime budget with API fixtures
        if: always()
        id: instance_contract
        run: python tools/test_vast_instance_contract.py -v
      - name: Test per-phase timeouts against the absolute billing deadline
        if: always()
        id: budget_deadline
        run: python tools/test_vast_budget_deadline.py -v
      - name: Test campaign marker and independent watchdog decisions
        if: always()
        id: campaign_guard_test
        run: python tools/test_vast_campaign_guard.py -v
      - name: Test independent Vast stop watchdog with mocked APIs
        if: always()
        id: campaign_watchdog_test
        run: |
          set -o pipefail
          mkdir -p test_results/refactor_20261121/vast-campaign-watchdog
          python tools/test_vast_campaign_watchdog.py -v 2>&1 | tee test_results/refactor_20261121/vast-campaign-watchdog/watchdog-test.log
      - name: Verify campaign marker, cleanup and watchdog workflow ordering
        if: always()
        id: campaign_workflow_test
        run: |
          set -o pipefail
          mkdir -p test_results/refactor_20261121/vast-campaign-watchdog
          python tools/test_vast_campaign_workflow.py -v 2>&1 | tee test_results/refactor_20261121/vast-campaign-watchdog/workflow-test.log
      - name: Test private manifest and checkpoint receipt parsing
        if: always()
        id: private_receipt_test
        run: python tools/test_vast_private_preflight.py -v
      - name: Test extracted remote payload and private log retention
        if: always()
        id: transport_test
        run: python tools/test_vast_result_transport.py -v
      - name: Test packaged source archive and vendored headers
        if: always()
        id: source_archive_test
        run: |
          set -o pipefail
          mkdir -p test_results/refactor_20261121/vast-source-archive
          python tools/test_vast_source_archive.py -v 2>&1 | tee test_results/refactor_20261121/vast-source-archive/archive-test.log
      - name: Syntax-check embedded remote Bash and Python payloads
        if: always()
        id: syntax_check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          source = Path(".github/workflows/vast-cnot-control-collectives.yml").read_text(encoding="utf-8")
          worker_path = Path("tools/vast_cnot_gpu_acceptance.sh")
          worker_text = worker_path.read_text(encoding="utf-8")
          marker = 'cat > "${RUNNER_TEMP}/run-cnot-control.sh" <<\'REMOTE\'\n'
          start = source.index(marker) + len(marker)
          end = source.index("\n          REMOTE\n", start)
          lines = source[start:end].splitlines()
          for number, line in enumerate(lines, 1):
              if line and not line.startswith("          "):
                  raise SystemExit(f"unexpected indentation in remote payload line {number}")
              if line:
                  lines[number - 1] = line[10:]
          payload = Path(os.environ["RUNNER_TEMP"]) / "vast-remote-payload.sh"
          payload_text = "\n".join(lines) + "\n"
          payload.write_text(payload_text, encoding="utf-8")
          subprocess.run(["bash", "-n", str(payload)], check=True)
          subprocess.run(["bash", "-n", str(worker_path)], check=True)
          stream5_source = Path("rust/beam-python/src/cnot_stream5.rs").read_text(encoding="utf-8")
          rust_acceptance_source = Path("rust/beam-python/src/cnot_acceptance.rs").read_text(encoding="utf-8")
          python_acceptance_source = Path("integrations/cayleypy_native/multigpubeamsearch/cnot_acceptance.py").read_text(encoding="utf-8")
          cuda_identity_source = Path("integrations/cayleypy_native/multigpubeamsearch/gpu_identity.py").read_text(encoding="utf-8")
          verify_cnot_source = Path("tools/verify_cnot.py").read_text(encoding="utf-8")
          if "tools/create_vast_source_archive.py" not in source:
              raise SystemExit("the Vast workflow must use the tested canonical source packager")
          if '--cutlass-dir "$cutlass_dir"' not in worker_text or "discover_nccl()" not in worker_text:
              raise SystemExit("permutation build must receive prevalidated CUTLASS and NCCL inputs")
          wheel_build_index = worker_text.index("-m pip wheel")
          source_preflight_index = worker_text.index("setup_sources(")
          if source_preflight_index > wheel_build_index or "offline=True" not in worker_text:
              raise SystemExit("CayleyPy, NCCL headers/library and pinned CUTLASS must be checked offline before wheel build")
          if "/private/cache/cayleypy-native" not in worker_text:
              raise SystemExit("the GPU worker must use the pre-staged pinned CUTLASS cache")
          if "REMOTE_ROOT" in payload_text:
              raise SystemExit("the SSH remote payload must derive result_dir from positional run_root")
          if 'bash "$source_dir/tools/vast_cnot_gpu_acceptance.sh"' not in payload_text:
              raise SystemExit("the remote wrapper must invoke the archived acceptance worker")
          if '--trace "${result_dir}/${case_id}.log"' not in worker_text:
              raise SystemExit("backend event validation must read completed per-case logs")
          if '--trace "${result_dir}/cuda-nccl.log"' in worker_text:
              raise SystemExit("do not read the outer tee log before the producer exits")
          if "observe_current_cuda_context" not in python_acceptance_source or "local_gpu_uuid(" not in rust_acceptance_source:
              raise SystemExit("the Rust and Python producers must bind events to the observed CUDA-context UUID")
          if "cuCtxGetDevice" not in cuda_identity_source or "cuDeviceGetUuid" not in cuda_identity_source:
              raise SystemExit("physical GPU identity must come from the current CUDA context")
          if "dist.all_gather_object(devices, hardware, group=world._control_group)" not in verify_cnot_source:
              raise SystemExit("rank hardware metadata must use the Gloo control group")
          if 'run_trained_case cnot-trained-qhat-1-gpu "${physical_gpu_uuids[0]}"' not in worker_text:
              raise SystemExit("trained workers must expose devices by full physical UUID")
          for required in (
              'instance_id="$7"',
              'manifest_sha="$8"',
              'checkpoint_sha="$9"',
              'github_run_id="${10}"',
              'MGBS_CNOT_STRICT_BACKEND=1',
              'MGBS_CNOT_OWNED_LIBRARY="$domain_library"',
              'BEAM_CNOT_OWNED_LIBRARY="$domain_library"',
              'stream5_active',
              'MGBS_CNOT_ACCEPTANCE_OBSERVED_GPU_UUID',
          ):
              if required not in source and required not in payload_text and required not in worker_text and required not in stream5_source:
                  raise SystemExit(f"missing acceptance contract: {required}")
          if "bash tools/vast_result_transport.sh" not in source:
              raise SystemExit("the GPU workflow must use the tested retained SSH control master")
          if "ControlMaster=yes -MNf" not in Path("tools/vast_result_transport.sh").read_text(encoding="utf-8"):
              raise SystemExit("result retrieval must reuse the authenticated ControlMaster")
          if "timeout --signal=TERM --kill-after=60s" not in Path("tools/vast_result_transport.sh").read_text(encoding="utf-8"):
              raise SystemExit("the remote test needs a bounded runtime")
          if not payload_text.startswith("set -euo pipefail") or 'instance_id="$7"' not in payload_text:
              raise SystemExit("the remote acceptance payload or selected instance ID was not extracted")
          lines = source.splitlines()
          heredoc_count = 0
          index = 0
          marker = "<" * 2 + "'" + "PY" + "'"
          while index < len(lines):
              if marker not in lines[index]:
                  index += 1
                  continue
              index += 1
              body = []
              while index < len(lines) and lines[index].strip() != "PY":
                  line = lines[index]
                  if line and not line.startswith("          "):
                      raise SystemExit(f"unexpected Python heredoc indentation at workflow line {index + 1}")
                  body.append(line[10:] if line else "")
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated Python heredoc")
              compile("\n".join(body) + "\n", f"<workflow-python-heredoc-{heredoc_count}>", "exec")
              heredoc_count += 1
              index += 1
          if heredoc_count < 5:
              raise SystemExit(f"expected embedded Python checks, found {heredoc_count}")
          worker_lines = worker_text.splitlines()
          worker_heredoc_count = 0
          index = 0
          while index < len(worker_lines):
              if marker not in worker_lines[index]:
                  index += 1
                  continue
              index += 1
              body = []
              while index < len(worker_lines) and worker_lines[index].strip() != "PY":
                  body.append(worker_lines[index])
                  index += 1
              if index >= len(worker_lines):
                  raise SystemExit("unterminated Python heredoc in remote acceptance worker")
              compile("\n".join(body) + "\n", f"<worker-python-heredoc-{worker_heredoc_count}>", "exec")
              worker_heredoc_count += 1
              index += 1
          if worker_heredoc_count < 4:
              raise SystemExit(f"expected embedded worker Python checks, found {worker_heredoc_count}")
          PY
      - name: Write redacted source validation status
        if: always()
        env:
          SOURCE_OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          python3 tools/vast_public_status.py \
            --source-outcome "$SOURCE_OUTCOME" \
            --inventory-query not_run \
            --preflight-outcome skipped \
            --gpu-outcome skipped \
            --cleanup-outcome skipped \
            --watchdog-outcome skipped \
            --output "${RUNNER_TEMP}/cnot-public-status.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted source validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnot-source-status-${{ github.run_id }}
          path: ${{ runner.temp }}/cnot-public-status.json
          if-no-files-found: error
          retention-days: 7


  producer_manifest:
    if: github.event_name == 'workflow_dispatch'
    name: Exact producer source manifest and supervisor checks
    uses: TryDotAtwo/cnot-neural-synth-frontier6/.github/workflows/check-full-training-manifest.yml@7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c
    with:
      source_sha: 7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c

  producer_cpu_runtime:
    if: github.event_name == 'workflow_dispatch'
    name: Exact producer CPU runtime, resume and profile checks
    uses: TryDotAtwo/cnot-neural-synth-frontier6/.github/workflows/check-full-training-cpu-runtime.yml@7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c
    with:
      source_sha: 7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c

  producer_cuda_build:
    if: github.event_name == 'workflow_dispatch'
    name: Exact producer CUDA build and link
    uses: TryDotAtwo/cnot-neural-synth-frontier6/.github/workflows/check-full-training-cuda-build.yml@7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c
    with:
      source_sha: 7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c

  producer_source_gate:
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    name: Require all exact producer checks
    needs: [producer_manifest, producer_cpu_runtime, producer_cuda_build]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Check out this consumer revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed unless every producer result matches its pin
        id: gate
        env:
          EXPECTED_SHA: 7310b1eb5ec07c76c131ba8c60b105ff4aad7a9c
          MANIFEST_RESULT: ${{ needs.producer_manifest.result }}
          MANIFEST_SHA: ${{ needs.producer_manifest.outputs.checked_sha }}
          CPU_RUNTIME_RESULT: ${{ needs.producer_cpu_runtime.result }}
          CPU_RUNTIME_SHA: ${{ needs.producer_cpu_runtime.outputs.checked_sha }}
          CUDA_BUILD_RESULT: ${{ needs.producer_cuda_build.result }}
          CUDA_BUILD_SHA: ${{ needs.producer_cuda_build.outputs.checked_sha }}
        run: |
          set -euo pipefail
          python3 tools/cnot_producer_source_gate.py \
            --expected-sha "$EXPECTED_SHA" \
            --manifest-result "$MANIFEST_RESULT" --manifest-sha "$MANIFEST_SHA" \
            --cpu-runtime-result "$CPU_RUNTIME_RESULT" --cpu-runtime-sha "$CPU_RUNTIME_SHA" \
            --cuda-build-result "$CUDA_BUILD_RESULT" --cuda-build-sha "$CUDA_BUILD_SHA" \
            --output "$GITHUB_OUTPUT"

  gpu-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.producer_source_gate.outputs.status == 'passed' }}
    needs: [validate-source, producer_source_gate]
    name: Build installed wheel and run Rust permutation plus CNOT acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      VAST_INSTANCE_ID: ${{ secrets.VAST_CNOT_ACCEPTANCE_INSTANCE_ID }}
      SPEND_CAP_USD: ${{ secrets.VAST_CNOT_ACCEPTANCE_CAP_USD }}
      SOURCE_SHA: ${{ github.sha }}
      REMOTE_ROOT: /workspace/codex-beam-gpu-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      HANDOFF_RUN_ROOT: ${{ secrets.VAST_CNOT_HANDOFF_RUN_ROOT }}
    steps:
      - name: Check out the exact source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read back and validate the selected Vast instance and lifetime cap
        id: preflight
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          exec 2>"${RUNNER_TEMP}/vast-preflight-private.log"
          echo "inventory_query=failed" >> "$GITHUB_OUTPUT"
          [[ -n "$HANDOFF_RUN_ROOT" ]] || { echo "Required private handoff root is not configured." >&2; exit 1; }
          python3 - "$HANDOFF_RUN_ROOT" <<'PY'
          from pathlib import PurePosixPath
          import sys
          raw = sys.argv[1]
          path = PurePosixPath(raw)
          if (not path.is_absolute() or path.parts[:2] != ("/", "private")
                  or len(path.parts) < 3 or ".." in path.parts or str(path) != raw):
              raise SystemExit("private handoff root must be canonical under /private")
          PY
          [[ -n "$VAST_API_KEY" ]] || { echo "Required private preflight configuration is missing." >&2; exit 1; }
          instances="${RUNNER_TEMP}/vast-instances.json"
          status="${RUNNER_TEMP}/vast-status.json"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          echo "inventory_query=success" >> "$GITHUB_OUTPUT"
          python3 tools/vast_instance_contract.py --verify-target-only \
            --payload "$instances" --instance-id "$VAST_INSTANCE_ID" >/dev/null
          campaign_label="$(python3 tools/vast_campaign_guard.py label \
            --payload "$instances" --instance-id "$VAST_INSTANCE_ID" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --spend-cap-usd "$SPEND_CAP_USD")"
          label_request="$(jq -cn --arg label "$campaign_label" '{label:$label}')"
          response="${RUNNER_TEMP}/vast-campaign-label-response.json"
          curl --fail --silent --show-error --max-time 30 -X PUT \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Content-Type: application/json" \
            --data-binary "$label_request" \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/" > "$response"
          jq -e '.success == true' "$response" >/dev/null
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          python3 tools/vast_campaign_guard.py verify \
            --payload "$instances" --instance-id "$VAST_INSTANCE_ID" --label "$campaign_label" >/dev/null
          echo "campaign_label=$campaign_label" >> "$GITHUB_OUTPUT"
          echo "safe_to_stop=true" >> "$GITHUB_OUTPUT"
          python3 tools/vast_instance_contract.py \
            --payload "$instances" --instance-id "$VAST_INSTANCE_ID" \
            --spend-cap-usd "$SPEND_CAP_USD" --report "$status" --github-output "$GITHUB_OUTPUT" >/dev/null
      - name: Attach a one-time SSH key to the validated target
        if: steps.preflight.outputs.instance_running == 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SSH_HOST: ${{ steps.preflight.outputs.ssh_host }}
          SSH_PORT: ${{ steps.preflight.outputs.ssh_port }}
        shell: bash
        run: |
          set -euo pipefail
          exec 2>"${RUNNER_TEMP}/vast-private-runner-errors.log"
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          ssh-keygen -q -t ed25519 -N "" -C "codex-cnot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f "$key_file"
          public_key="$(cat "${key_file}.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Content-Type: application/json" \
            --data-binary "$request" \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh" >/dev/null
      - name: Verify private source, checkpoint, GPU stack and disk before upload or build
        id: privatepreflight
        if: steps.preflight.outputs.instance_running == 'true'
        timeout-minutes: 5
        env:
          SSH_HOST: ${{ steps.preflight.outputs.ssh_host }}
          SSH_PORT: ${{ steps.preflight.outputs.ssh_port }}
          BUDGET_DEADLINE_EPOCH: ${{ steps.preflight.outputs.budget_deadline_epoch }}
          STOP_RESERVE_SECONDS: ${{ steps.preflight.outputs.stop_reserve_seconds }}
          RETRIEVAL_RESERVE_SECONDS: ${{ steps.preflight.outputs.retrieval_reserve_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          exec 2>>"${RUNNER_TEMP}/vast-preflight-private.log"
          private_timeout="$(python3 tools/vast_budget_deadline.py \
            --deadline-epoch "$BUDGET_DEADLINE_EPOCH" \
            --stop-reserve-seconds "$STOP_RESERVE_SECONDS" \
            --future-reserve-seconds "$((60 + 900 + 5400 + 1200 + RETRIEVAL_RESERVE_SECONDS))" \
            --phase-overhead-seconds 0 --termination-grace-seconds 70 \
            --max-seconds 300 --min-seconds 240 --phase private-preflight)"
          preflight_deadline=$((SECONDS + private_timeout))
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          remote_log="${RUNNER_TEMP}/vast-private-preflight.log"
