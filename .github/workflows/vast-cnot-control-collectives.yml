      - name: Stop only the validated new instance and read back lifecycle state
        if: always() && steps.preflight.outputs.safe_to_stop == 'true'
        timeout-minutes: 4
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          INSTANCE_ID: ${{ env.VAST_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_cnot_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_cnot_known_hosts"
          trap 'rm -f "$key_file" "${key_file}.pub" "$known_hosts"' EXIT
          instances="${RUNNER_TEMP}/vast-stop-readback.json"
          lifecycle="${RUNNER_TEMP}/vast-stop-lifecycle.json"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "$instances"
          python3 tools/vast_instance_contract.py --verify-target-only --payload "$instances" --instance-id "$INSTANCE_ID"
          current="$(jq -er --arg id "$INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | (.actual_status // .cur_state // "unknown")' "$instances")"
          if [[ "$current" == "stopped" || "$current" == "exited" ]]; then
            printf '{"instance_id":"%s","stop":"already_stopped","readback":"%s"}\n' "$INSTANCE_ID" "$current" > "$lifecycle"
          else
            body='{"state":"stopped"}'
            response="${RUNNER_TEMP}/vast-stop-response.json"
            curl --fail --silent --show-error --max-time 30 -X PUT \
              -H "Authorization: Bearer ${VAST_API_KEY}" -H "Content-Type: application/json" \
              --data-binary "$body" "https://console.vast.ai/api/v0/instances/${INSTANCE_ID}/" > "$response"
            jq -e '.success == true' "$response" >/dev/null
            stopped=false
            for attempt in {1..12}; do
              curl --fail --silent --show-error --max-time 20 \
                -H "Authorization: Bearer ${VAST_API_KEY}" -H "Accept: application/json" \
                "https://console.vast.ai/api/v0/instances/" > "$instances"
              current="$(jq -er --arg id "$INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | (.actual_status // .cur_state // "unknown")' "$instances")"
              if [[ "$current" == "stopped" || "$current" == "exited" ]]; then stopped=true; break; fi
              sleep 5
            done
            printf '{"instance_id":"%s","stop":"requested","readback":"%s","confirmed":%s}\n' "$INSTANCE_ID" "$current" "$stopped" > "$lifecycle"
            [[ "$stopped" == true ]] || { echo "Vast did not confirm stopped state for the validated new target." >&2; exit 1; }
          fi
          python3 - "${RUNNER_TEMP}/vast-status.json" "$lifecycle" \
            "${RUNNER_TEMP}/beam-gpu-acceptance-test-results.tar.gz" "$INSTANCE_ID" <<'PY'
          import json, pathlib, sys, tarfile, time
          status_path, lifecycle_path, archive_path = map(pathlib.Path, sys.argv[1:4])
          report = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {"instance_id": sys.argv[4]}
          lifecycle = json.loads(lifecycle_path.read_text(encoding="utf-8"))
          report["lifecycle"] = lifecycle
          stopped_at = int(time.time())
          start = report.get("instance_start_epoch")
          hourly = report.get("hourly_rate_usd")
          if start is not None and hourly is not None:
              elapsed = max(0, stopped_at - int(float(start)))
              report["elapsed_until_lifecycle_readback_seconds"] = elapsed
              report["estimated_total_cost_usd"] = f"{float(hourly) * elapsed / 3600:.6f}"
          report["lifecycle_readback_epoch"] = stopped_at
          report["remote_receipt_status"] = "unavailable"
          if archive_path.is_file() and archive_path.stat().st_size:
              try:
                  with tarfile.open(archive_path, "r:gz") as archive:
                      member = archive.extractfile("test_results/refactor_20261121/gpu-acceptance/receipt.json")
                      if member is not None:
                          report["gpu_acceptance_receipt"] = json.load(member)
                          report["remote_receipt_status"] = "collected"
              except Exception as error:
                  report["remote_receipt_error"] = str(error)
          status_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cat "$lifecycle"
