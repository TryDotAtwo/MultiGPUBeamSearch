name: Package precompiled H200 benchmark
on:
  push:
    branches: [codex/cube444-fp16-blend-evidence-20261009]
    paths:
      - 'test_results/cube444_index1000_h200_20261009/runner-h200.tar.gz'
      - '.github/workflows/package-h200.yml'
      - 'test_results/cube444_index1000_h200_20261009/Dockerfile'
      - 'test_results/cube444_index1000_h200_20261009/prepare_inputs.py'
permissions:
  contents: read
  packages: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test_results/cube444_index1000_h200_20261009
      - name: Verify precompiled payload
        working-directory: test_results/cube444_index1000_h200_20261009
        run: |
          sha256sum -c runner-h200.tar.gz.sha256
          tar -xzf runner-h200.tar.gz
          python3 -c 'import hashlib,json; r=json.load(open("build_receipt.json")); assert hashlib.sha256(open("runner-h200","rb").read()).hexdigest()==r["binary_sha256"]'
      - name: Publish image without compiling
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/trydotatwo/multigpubeamsearch-h200:${GITHUB_SHA}"
          docker build -t "$image" test_results/cube444_index1000_h200_20261009
          docker push "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" | tee image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: h200-image-digest
          path: image-digest.txt

