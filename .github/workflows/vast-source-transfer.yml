name: Transfer pinned source to Vast

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vast-source-transfer-61080396
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer code-only source archive
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VAST_INSTANCE_ID: "61080396"
      SOURCE_SHA: "f83b5b658358c5df5067f03dfbb970b2e7551e4e"
    steps:
      - name: Check the existing Vast instance
        id: status
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.vast.ai/api/v0/instances/" > "${RUNNER_TEMP}/vast-instances.json"
          python3 - "${VAST_INSTANCE_ID}" "${RUNNER_TEMP}/vast-instances.json" "${RUNNER_TEMP}/vast-status.json" "$GITHUB_OUTPUT" <<'PY'
          import datetime, json, re, sys
          instance_id = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as source:
              payload = json.load(source)
          rows = payload.get("instances", []) if isinstance(payload, dict) else payload
          if not isinstance(rows, list):
              raise SystemExit("Unexpected Vast API response shape")
          matches = [r for r in rows if isinstance(r, dict) and str(r.get("id")) == str(instance_id)]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one matching Vast instance")
          row = matches[0]
          def state(*keys):
              for key in keys:
                  value = row.get(key)
                  if isinstance(value, dict):
                      value = value.get("state") or value.get("status")
                  if isinstance(value, str) and value:
                      return re.sub(r"[^A-Za-z0-9 _-]", "", value)[:32]
              return "unknown"
          actual = state("actual_status", "status", "cur_state")
          report = {
              "instance_id": instance_id,
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "actual_status": actual,
              "intended_status": state("intended_status")
          }
          with open(sys.argv[3], "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2)
              output.write("\n")
          with open(sys.argv[4], "a", encoding="utf-8") as output:
              output.write(f"instance_running={'true' if actual.lower() == 'running' else 'false'}\n")
          PY
      - name: Checkout pinned source paths
        if: steps.status.outputs.instance_running == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            cmake
            cuda
            integrations/cayleypy_native
            native
            rust
            src
            tools
          sparse-checkout-cone-mode: true
      - name: Create a code-only source archive
        id: archive
        if: steps.status.outputs.instance_running == 'true'
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          [[ "$checked_out" == "$SOURCE_SHA" ]] || { echo "Checkout SHA mismatch." >&2; exit 1; }
          archive="${RUNNER_TEMP}/beam-source-${SOURCE_SHA}.tar.gz"
          tar -czf "$archive" -C "$GITHUB_WORKSPACE" \
            CMakeLists.txt Cargo.toml Cargo.lock cmake cuda integrations/cayleypy_native native rust src tools
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c %s "$archive")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
      - name: Transfer and verify on Vast
        id: remote
        if: steps.status.outputs.instance_running == 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.archive.outputs.archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/vast_transfer_ed25519"
          known_hosts="${RUNNER_TEMP}/vast_transfer_known_hosts"
          comment="codex-vast-transfer-${VAST_INSTANCE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$key_file" "$key_file.pub" "$known_hosts"' EXIT
          ssh-keygen -q -t ed25519 -N "" -C "$comment" -f "$key_file"
          public_key="$(cat "$key_file.pub")"
          request="$(jq -cn --arg ssh_key "$public_key" '{ssh_key:$ssh_key}')"
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H "Authorization: Bearer ${VAST_API_KEY}" \
            -H "Content-Type: application/json" --data-binary "$request" --output /dev/null \
            "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/ssh"
          host="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .public_ipaddr | select(type=="string" and length>0)' "${RUNNER_TEMP}/vast-instances.json")"
          port="$(jq -er --arg id "$VAST_INSTANCE_ID" '.instances[] | select((.id|tostring)==$id) | .ports["22/tcp"][0].HostPort | tostring | select(test("^[0-9]+$"))' "${RUNNER_TEMP}/vast-instances.json")"
          [[ "$host" =~ ^[0-9.]+$ ]] || { echo "Invalid SSH host for the fixed instance." >&2; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port for the fixed instance." >&2; exit 1; }
          key_blob="$(awk '{print $2}' "$key_file.pub")"
          ssh_opts=(-i "$key_file" -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          remote_archive="/tmp/beam-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp "${ssh_opts[@]}" "$ARCHIVE_PATH" "root@${host}:${remote_archive}" > /dev/null 2> "${RUNNER_TEMP}/vast-scp-stderr.txt"
          cat > "${RUNNER_TEMP}/verify-source-transfer.sh" <<'REMOTE'
          set -euo pipefail
          key_blob="$1"
          expected_sha="$2"
          expected_bytes="$3"
          source_sha="$4"
          remote_archive="$5"
          run_id="$6"
          authorized=/root/.ssh/authorized_keys
          cleanup() {
            rm -f "$remote_archive"
            if [[ -f "$authorized" ]]; then
              temp="${authorized}.codex.$$"
              awk -v key="$key_blob" '{keep=1; for (i=1; i<=NF; i++) if ($i==key) keep=0; if (keep) print}' "$authorized" > "$temp" || return 0
              chmod --reference="$authorized" "$temp" 2>/dev/null || chmod 600 "$temp"
              chown --reference="$authorized" "$temp" 2>/dev/null || true
              mv "$temp" "$authorized"
            fi
          }
          trap cleanup EXIT
          actual_bytes="$(stat -c %s "$remote_archive")"
          actual_sha="$(sha256sum "$remote_archive" | awk '{print $1}')"
          [[ "$actual_bytes" == "$expected_bytes" ]] || { echo "Transferred source archive size mismatch." >&2; exit 1; }
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "Transferred source archive SHA-256 mismatch." >&2; exit 1; }
          dest="/workspace/codex-source-transfers/${source_sha}-${run_id}"
          mkdir -p "$dest"
          tar -xzf "$remote_archive" -C "$dest"
          test -f "$dest/Cargo.toml"
          test -f "$dest/CMakeLists.txt"
          file_count="$(find "$dest" -type f | wc -l | tr -d ' ')"
          printf '{"transfer":"verified","source_commit":"%s","archive_sha256":"%s","archive_bytes":%s,"file_count":%s}\n' "$source_sha" "$actual_sha" "$actual_bytes" "$file_count"
          REMOTE
          if ! ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "root@${host}" "bash -s -- ${key_blob} ${ARCHIVE_SHA} ${ARCHIVE_BYTES} ${SOURCE_SHA} ${remote_archive} ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            < "${RUNNER_TEMP}/verify-source-transfer.sh" \
            > "${RUNNER_TEMP}/vast-source-transfer.json" \
            2> "${RUNNER_TEMP}/vast-ssh-stderr.txt"; then
            echo "Remote source transfer verification failed; the archive contents were not emitted." >&2
            exit 1
          fi
      - name: Finalize transfer report
        if: always() && steps.status.outcome == 'success'
        env:
          INSTANCE_RUNNING: ${{ steps.status.outputs.instance_running }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          ARCHIVE_SHA: ${{ steps.archive.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.archive.outputs.archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/vast-status.json" "${RUNNER_TEMP}/vast-source-transfer.json" "${RUNNER_TEMP}/vast-source-transfer-report.json" "$INSTANCE_RUNNING" "$REMOTE_OUTCOME" "$ARCHIVE_SHA" "$ARCHIVE_BYTES" "$SOURCE_SHA" <<'PY'
          import json, os, sys
          status_path, remote_path, output_path, running, outcome, archive_sha, archive_bytes, source_sha = sys.argv[1:]
          with open(status_path, encoding="utf-8") as source:
              result = json.load(source)
          result["source_commit"] = source_sha
          if archive_sha:
              result["archive_sha256"] = archive_sha
              result["archive_bytes"] = int(archive_bytes)
          remote = None
          if os.path.isfile(remote_path) and os.path.getsize(remote_path) > 0:
              try:
                  with open(remote_path, encoding="utf-8") as source:
                      remote = json.load(source)
                  if not isinstance(remote, dict):
                      remote = None
              except (OSError, json.JSONDecodeError):
                  remote = None
          if remote is not None:
              result.update(remote)
          elif running == "true":
              result["transfer"] = "failed" if outcome in ("failure", "success") else "unavailable"
          else:
              result["transfer"] = "skipped_instance_not_running"
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
              output.write("\n")
          PY
          jq -r '"Instance: \(.instance_id) (\(.actual_status))\nSource commit: \(.source_commit)\nTransfer: \(.transfer // "unknown")\nArchive SHA-256: \(.archive_sha256 // "not created")\nFiles on Vast: \(.file_count // "not transferred")"' \
            "${RUNNER_TEMP}/vast-source-transfer-report.json" >> "$GITHUB_STEP_SUMMARY"
          jq -c '{instance_id,actual_status,intended_status,source_commit,transfer,archive_sha256,archive_bytes,file_count}' \
            "${RUNNER_TEMP}/vast-source-transfer-report.json"
      - name: Upload transfer receipt
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vast-source-transfer-receipt
          path: ${{ runner.temp }}/vast-source-transfer-report.json
          if-no-files-found: error
          retention-days: 7
