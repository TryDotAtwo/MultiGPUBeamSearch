[workspace]
resolver = "2"
members = ["rust/beam-core", "rust/beam-native-sys", "rust/beam-runtime", "rust/beam-cli", "rust/beam-python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "=0.10.9"
libloading = "0.8"
pyo3 = { version = "0.24", features = ["abi3-py310", "extension-module"] }
beam-core = { path = "rust/beam-core" }
beam-native-sys = { path = "rust/beam-native-sys" }
beam-runtime = { path = "rust/beam-runtime" }
